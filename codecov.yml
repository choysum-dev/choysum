codecov:
  require_ci_to_pass: true

coverage:
  precision: 1
  round: down
  status:
    # Project: ratchet against parent (auto). threshold 0.5% = tolerate tiny
    # noise from impacted-module / partial uploads while still blocking real drops.
    # Intent: keep raising total coverage; tighten to 0% once carryforward is solid.
    project:
      default:
        target: auto
        threshold: 0.5%
        if_ci_failed: error
    # Patch: every changed covered line in the PR should be tested (100%).
    # Escape hatches: existing ignore: globs; rare Codecov ignore comments for
    # truly unreachable / generated-adjacent lines — do not use to skip product logic.
    patch:
      default:
        target: 100%
        threshold: 0%
        if_ci_failed: error

ignore:
  - "**/*.pb.go"
  - "**/*_test.go"
  - "**/*.spec.ts"
  - "**/*.test.ts"
  # Test helpers/fixtures under service/tests (not product code; *.test.ts already ignored).
  - "modules/**/service/tests/**"
  # Legacy path from addons→modules rename; exclude stale carryforward from project totals.
  - "addons/**"
  - ".dev/**"
  # Vendored L2 SFCs only (shadcn-vue hand-adapted). Module-agnostic so ignore
  # survives choy_ui → web cutover; hand-written helpers stay coverage-eligible.
  - "modules/*/web/components/vendor/ui/**/*.vue"
  # Frontend unit stubs (Codemirror / TipTap stand-ins), not product code.
  - "internal/testing/frontend/testdata/stubs/**"
  # Sandbox kitchen-sink view shells: page_mount smoke covers wiring; fill/clear
  # helpers need a full form host and are demo-only.
  - "modules/sandbox/web/views/SandboxLinesVirtTools.vue"
  - "modules/sandbox/web/views/SandboxRecordChartView.vue"
