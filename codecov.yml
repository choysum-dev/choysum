codecov:
  require_ci_to_pass: true

coverage:
  precision: 1
  round: down
  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error

ignore:
  - "**/*.pb.go"
  - "**/*_test.go"
  - "**/*.spec.ts"
  - "**/*.test.ts"
  - ".dev/**"
  # Vue SFC templates are not instrumented by Vitest coverage-v8. P6 i18n
  # view diffs are mostly `:label="_t(...)"` removals; script setup is already
  # exercised by lt_mount suites. Ignoring views keeps patch % honest for logic.
  - "modules/**/web/views/**/*.vue"