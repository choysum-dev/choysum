codecov:
  require_ci_to_pass: true

coverage:
  precision: 1
  round: down
  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error

ignore:
  - "**/*.pb.go"
  - "**/*_test.go"
  - "**/*.spec.ts"
  - "**/*.test.ts"
  - ".dev/**"