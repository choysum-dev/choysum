codecov:
  require_ci_to_pass: true

coverage:
  precision: 1
  round: down
  status:
    # Project: keep overall level from collapsing; allow small noise from
    # impacted-module / partial uploads (carryforward can tighten later).
    project:
      default:
        target: auto
        threshold: 2%
        if_ci_failed: error
    # Patch: fixed bar on changed lines (not auto). New code should be mostly tested.
    patch:
      default:
        target: 70%
        threshold: 0%
        if_ci_failed: error

ignore:
  - "**/*.pb.go"
  - "**/*_test.go"
  - "**/*.spec.ts"
  - "**/*.test.ts"
  # Test helpers/fixtures under service/tests (not product code; *.test.ts already ignored).
  - "modules/**/service/tests/**"
  - ".dev/**"
