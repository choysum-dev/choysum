# PR-Agent repo configuration.
# Loaded from the default branch; keep this file minimal and project-specific.
# See: https://docs.pr-agent.ai/usage-guide/configuration_options/

[pr_description]
enable_pr_diagram = false
extra_instructions = """\
- Write the PR title and description in English.
- Prefer a conventional-commit style title when possible (feat/fix/refactor/docs/test/chore with optional scope).
- Clearly separate Go core changes (outside modules/) from TypeScript module changes (modules/).
- Call out any new source files that need SPDX headers, and any license-boundary impact.
- Mention test coverage: Go tests, TypeScript/unit/e2e as relevant to the change.
"""

[pr_reviewer]
require_security_review = true
require_tests_review = true
require_todo_scan = true
# Default is 3; raise so review does not stop after the first few findings.
num_max_findings = 12
inline_key_issues = true
persistent_comment = true
enable_help_text = false
# Do not post when nothing actionable was found (avoids "No major issues detected" noise).
publish_output_no_suggestions = false
extra_instructions = """\
Choysum is a TypeScript-first ERP framework with a Go core engine and compile-time IMD module extensions.

Your job is to find problems in this PR, not to summarize it. Be thorough on the changed diff.

Prioritize reporting:
- Logic bugs, wrong assumptions, missing error handling, panics/nil derefs, race conditions, resource leaks.
- Authz/session/security gaps (ERP: record rules, company scoping, injection, unsafe deserialization, secrets).
- API/schema/ORM compatibility breaks, migration hazards, and data-loss paths.
- Missing or weakened tests for changed behavior (Go tests, module unit/e2e, CLI contracts under cmd/).
- License boundaries: core outside modules/ is LGPL-3.0-or-later; modules/ are Apache-2.0. Flag missing SPDX on new files or core code copied into modules/.
- IMD/module isolation mistakes: overrides that fork core instead of extending it.

If something looks risky but you are not fully sure, still report it and label confidence (high/medium/low). Prefer false positives over silent misses on correctness and security.

Skip pure formatting nits that gofmt or existing linters already enforce.
"""

[pr_code_suggestions]
# false = also surface maintainability, missing guards, and test gaps (not only obvious bugs).
focus_only_on_problems = false
auto_extended_mode = true
parallel_calls = true
num_code_suggestions_per_chunk = 8
max_number_of_calls = 5
suggestions_score_threshold = 0
# false = each /improve (manual or auto-on-push) posts a new comment instead of editing the previous one.
persistent_comment = false
enable_help_text = false
enable_chat_text = false
# Do not post when /improve finds nothing (avoids "No code suggestions found" noise).
publish_output_no_suggestions = false
extra_instructions = """\
- Propose concrete, minimal fixes for bugs, security issues, regressions, missing error paths, and test gaps introduced by this PR.
- Respect project boundaries: do not suggest moving core framework code into modules/, or the reverse.
- For new files, flag missing SPDX headers (LGPL-3.0-or-later outside modules/, Apache-2.0 under modules/).
- Prefer idiomatic Go and TypeScript matching surrounding code; avoid drive-by refactors.
- Do not suggest Node.js runtime dependencies for business-layer TypeScript meant to run on the Go-embedded engine.
- When the diff looks correct but fragile (edge cases, partial failure, auth bypass), suggest hardening anyway.
- Skip formatter-only/style churn; do not stay silent on real correctness or security concerns.
"""
