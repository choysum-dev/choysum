<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 基本信息 -->
    <title>Choysum</title>
    <meta name="description" content="Choysum - 企业资源计划管理系统" />

    <!-- 图标 -->
    <link rel="icon" href="assets/favicon.ico" />

    <!-- 初始样式 -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      #app {
        height: 100%;
      }

      .app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        /* tokens.css may not be loaded yet; hex matches light --choy-* */
        background-color: var(--choy-color-background, #f7f8fa);
      }

      /*
       * Open arc ≈ Lucide Loader2 (SPA ChoySpinner): primary stroke, gap, ~size-6.
       * Fallback hex ≈ light --choy-color-primary (oklch 0.55 0.15 160).
       */
      .loading-spinner {
        width: 24px;
        height: 24px;
        color: var(--choy-color-primary, #168c6e);
        animation: spin 1s linear infinite;
      }

      .loading-spinner svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <!-- 主题预加载 -->
    <script>
      (function () {
        const savedTheme = localStorage.getItem('choysum.theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <!-- 初始加载提示 -->
    <div id="app">
      <div class="app-loading">
        <div class="loading-spinner" role="status" aria-label="Loading">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-dasharray="46 64"
            />
          </svg>
        </div>
      </div>
    </div>
  </body>
</html>
