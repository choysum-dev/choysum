# Shared CodeQL config for .github/workflows/codeql.yml.
# paths-ignore applies to javascript-typescript (and other non-build scans).

name: "Choysum CodeQL"

paths-ignore:
  # language-core service-script goldens (fixtures for GoldenCoder; not product TS)
  - "internal/typecheck/testdata/vue/golden/**"
  # Vendored L2 primitives stay in CodeQL scope: files are hand-adapted product
  # sources. Review-noise ignores live in .pr_agent.toml / .coderabbit.yaml /
  # .sourcery.yaml / codecov.yml instead.
