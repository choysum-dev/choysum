name: Feature request
description: Propose an improvement or new feature for Choysum.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the proposal. Please describe the problem and the expected value clearly.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
      placeholder: "As a ..., I want ..., so that ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe your preferred solution and expected behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions you considered and why they are less suitable.

  - type: textarea
    id: scope
    attributes:
      label: Affected scope
      description: Which module(s) or area(s) are involved?
      placeholder: "Example: core runtime, modules/web, CLI, API"

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Clear conditions that define done.
      placeholder: |
        - [ ] Behavior A
        - [ ] Behavior B

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration impact
      description: Any breaking changes, migration steps, or rollout constraints?

  - type: textarea
    id: references
    attributes:
      label: References
      description: Related issues, PRs, design docs, screenshots, or examples.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked existing issues and discussions for similar requests.
          required: true
        - label: This proposal is scoped and actionable.
          required: true
