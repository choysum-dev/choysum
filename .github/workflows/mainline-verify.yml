name: Mainline Verify

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to run Mainline Verify against
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mainline-verify-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  prepare-embedded-assets:
    name: main / prepare-embedded-assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            internal/bootstrap/web/package-lock.json
            pkg/jsengine/scripts/vuesfc/package-lock.json

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Vue SFC npm dependencies
        working-directory: pkg/jsengine/scripts/vuesfc
        run: npm ci

      - name: Build Vue SFC embed asset
        working-directory: pkg/jsengine/scripts/vuesfc
        run: npm run build

      - name: Install bootstrap npm dependencies
        working-directory: internal/bootstrap/web
        run: npm ci

      - name: Build bootstrap dist
        working-directory: internal/bootstrap/web
        run: npm run build

      - name: Pack embedded assets
        run: |
          mkdir -p .choysum/tmp
          tar -czf .choysum/tmp/main-embedded-assets.tar.gz \
            internal/bootstrap/web/dist \
            pkg/jsengine/scripts/vuesfc/dist/index.js

      - name: Upload embedded assets
        uses: actions/upload-artifact@v4
        with:
          name: main-embedded-assets
          path: .choysum/tmp/main-embedded-assets.tar.gz
          if-no-files-found: error
          retention-days: 1

  prepare-root-node-modules:
    name: main / prepare-root-node-modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Pack root node_modules
        run: |
          mkdir -p .choysum/tmp
          tar -czf .choysum/tmp/main-root-node-modules.tar.gz node_modules

      - name: Upload root node_modules
        uses: actions/upload-artifact@v4
        with:
          name: main-root-node-modules
          path: .choysum/tmp/main-root-node-modules.tar.gz
          if-no-files-found: error
          retention-days: 1

  go-test:
    name: main / go-test
    needs:
      - prepare-embedded-assets
      - prepare-root-node-modules
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download embedded assets
        uses: actions/download-artifact@v4
        with:
          name: main-embedded-assets
          path: .choysum/tmp

      - name: Extract embedded assets
        run: tar -xzf .choysum/tmp/main-embedded-assets.tar.gz -C .

      - name: Download root node_modules
        uses: actions/download-artifact@v4
        with:
          name: main-root-node-modules
          path: .choysum/tmp

      - name: Extract root node_modules
        run: tar -xzf .choysum/tmp/main-root-node-modules.tar.gz -C .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run go build
        run: go build ./...

      - name: Run go test
        run: go test ./... -count=1

  typecheck-all:
    name: main / typecheck-all
    needs:
      - prepare-embedded-assets
      - prepare-root-node-modules
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download embedded assets
        uses: actions/download-artifact@v4
        with:
          name: main-embedded-assets
          path: .choysum/tmp

      - name: Extract embedded assets
        run: tar -xzf .choysum/tmp/main-embedded-assets.tar.gz -C .

      - name: Download root node_modules
        uses: actions/download-artifact@v4
        with:
          name: main-root-node-modules
          path: .choysum/tmp

      - name: Extract root node_modules
        run: tar -xzf .choysum/tmp/main-root-node-modules.tar.gz -C .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run addon typecheck
        run: go run . test typecheck --all

  unit-all:
    name: main / unit-all
    needs:
      - prepare-embedded-assets
      - prepare-root-node-modules
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download embedded assets
        uses: actions/download-artifact@v4
        with:
          name: main-embedded-assets
          path: .choysum/tmp

      - name: Extract embedded assets
        run: tar -xzf .choysum/tmp/main-embedded-assets.tar.gz -C .

      - name: Download root node_modules
        uses: actions/download-artifact@v4
        with:
          name: main-root-node-modules
          path: .choysum/tmp

      - name: Extract root node_modules
        run: tar -xzf .choysum/tmp/main-root-node-modules.tar.gz -C .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run unit suite
        run: go run . test unit --all

  e2e-all:
    name: main / e2e-all
    needs:
      - prepare-embedded-assets
      - prepare-root-node-modules
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download embedded assets
        uses: actions/download-artifact@v4
        with:
          name: main-embedded-assets
          path: .choysum/tmp

      - name: Extract embedded assets
        run: tar -xzf .choysum/tmp/main-embedded-assets.tar.gz -C .

      - name: Download root node_modules
        uses: actions/download-artifact@v4
        with:
          name: main-root-node-modules
          path: .choysum/tmp

      - name: Extract root node_modules
        run: tar -xzf .choysum/tmp/main-root-node-modules.tar.gz -C .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: go run . test e2e --all

  bootstrap-verify:
    name: main / bootstrap-verify
    needs:
      - prepare-embedded-assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download embedded assets
        uses: actions/download-artifact@v4
        with:
          name: main-embedded-assets
          path: .choysum/tmp

      - name: Extract embedded assets
        run: tar -xzf .choysum/tmp/main-embedded-assets.tar.gz -C .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/bootstrap/web/package-lock.json

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install bootstrap npm dependencies
        working-directory: internal/bootstrap/web
        run: npm ci

      - name: Run bootstrap verify
        working-directory: internal/bootstrap/web
        run: npm run verify:bootstrap:release