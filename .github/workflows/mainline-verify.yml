name: Mainline Verify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mainline-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-embedded-assets:
    name: main / prepare-embedded-assets
    uses: ./.github/workflows/prepare-embedded-assets.yml
    with:
      artifact_name: main-embedded-assets
      archive_path: .choysum/tmp/main-embedded-assets.tar.gz
      retention_days: 1

  prepare-root-node-modules:
    name: main / prepare-root-node-modules
    needs:
      - discover-modules
    uses: ./.github/workflows/prepare-root-node-modules.yml
    with:
      artifact_name: main-root-node-modules
      archive_path: .choysum/tmp/main-root-node-modules.tar.gz
      retention_days: 1
      target_modules_json: ${{ needs.discover-modules.outputs.modules_json }}

  prepare-playwright-cache:
    name: main / prepare-playwright-cache
    if: ${{ needs.discover-modules.outputs.e2e_modules_json != '[]' }}
    needs:
      - discover-modules
      - prepare-root-node-modules
    uses: ./.github/workflows/prepare-playwright-cache.yml
    with:
      artifact_name: main-root-node-modules

  discover-modules:
    name: main / discover-modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      modules_json: ${{ steps.discover.outputs.modules_json }}
      e2e_modules_json: ${{ steps.discover.outputs.e2e_modules_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Discover module matrices
        id: discover
        run: |
          set -euo pipefail
          python3 scripts/ci/module_matrix_discovery.py discover-mainline

  build-choysum-cli:
    name: main / build-choysum-cli
    needs:
      - prepare-embedded-assets
    uses: ./.github/workflows/build-choysum-cli.yml
    with:
      embedded_assets_artifact_name: main-embedded-assets
      embedded_assets_archive_path: .choysum/tmp/main-embedded-assets.tar.gz
      choysum_artifact_name: main-choysum-cli
      choysum_binary_path: .choysum/tmp/choysum
      retention_days: 1

  go-test:
    name: main / go-test
    needs:
      - prepare-embedded-assets
      - prepare-root-node-modules
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download and extract embedded assets
        uses: ./.github/actions/download-extract-embedded-assets
        with:
          artifact-name: main-embedded-assets
          archive-path: .choysum/tmp/main-embedded-assets.tar.gz

      - name: Download root node_modules
        uses: actions/download-artifact@v8
        with:
          name: main-root-node-modules
          path: .choysum/tmp

      - name: Extract root node_modules
        run: tar -xzf .choysum/tmp/main-root-node-modules.tar.gz -C .

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Coverage compile already typechecks; a separate `go build ./...` only doubles wall clock.
      - name: Run go test
        run: |
          mkdir -p .choysum/coverage/main
          go test ./... -count=1 -covermode=atomic -coverprofile=.choysum/coverage/main/go.out

      - name: Upload Go coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: false
          files: .choysum/coverage/main/go.out
          name: mainline-go
          use_oidc: true
          verbose: true

  prepare-typecheck-types:
    name: main / prepare-typecheck-types
    if: ${{ needs.discover-modules.outputs.modules_json != '[]' }}
    needs:
      - discover-modules
      - build-choysum-cli
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download choysum CLI
        uses: actions/download-artifact@v8
        with:
          name: main-choysum-cli
          path: .choysum/tmp

      - name: Make choysum CLI executable
        run: chmod +x .choysum/tmp/choysum

      - name: Setup CLI testing pkg cache
        uses: ./.github/actions/setup-cli-testing-cache

      - name: Warm type-fetch assets into CLI pkg cache
        run: |
          set -euo pipefail
          CHOYSUM_BIN="$(pwd)/.choysum/tmp/choysum"
          # Idempotent: cached packages are reused. Needed because restore-keys may
          # return an ESM-only or otherwise incomplete pkg tree without types.
          echo "Warming type-fetch cache via type-fetch --all"
          "$CHOYSUM_BIN" type-fetch --all
          types_dir="${CHOYSUM_TEST_TMP}/cache/pkg/types"
          mkdir -p "$types_dir"
          rm -f "$types_dir"/vue@*.d.ts \
            "$types_dir"/esm.sh_vue@* \
            "$types_dir"/esm.sh_@vue_runtime-dom@* \
            "$types_dir"/esm.sh_@vue_runtime-core@* \
            "$types_dir"/esm.sh_@vue_reactivity@*
          echo "Re-fetching vue type graph"
          "$CHOYSUM_BIN" type-fetch web
          # Require the tsconfig-pinned vue entry (not a hollow/wrong-version graph).
          pinned="$(python3 - <<'PY'
import re, pathlib
text = pathlib.Path("modules/tsconfig.json").read_text()
# Match the vue paths entry without full JSONC parse (comments/trailing commas).
m = re.search(
    r'"vue"\s*:\s*\[\s*"([^"]*esm\.sh_vue@([^/_"]+)[^"]*)"',
    text,
)
if not m:
    raise SystemExit("pinned vue version not found in modules/tsconfig.json")
print(m.group(2))
PY
)"
          echo "Pinned vue from tsconfig: $pinned"
          vue_entry="$types_dir/esm.sh_vue@${pinned}_dist_vue.d.mts.d.ts"
          core_dts="$types_dir/esm.sh_@vue_runtime-core@${pinned}_dist_runtime-core.d.ts.d.ts"
          react_dts="$types_dir/esm.sh_@vue_reactivity@${pinned}_dist_reactivity.d.ts.d.ts"
          if [[ ! -s "$vue_entry" || ! -s "$core_dts" || ! -s "$react_dts" ]]; then
            echo "error: pinned vue@$pinned type-fetch graph missing under $types_dir" >&2
            ls -la "$types_dir"/esm.sh_vue@* "$types_dir"/esm.sh_@vue_runtime-* "$types_dir"/esm.sh_@vue_reactivity@* 2>/dev/null || true
            exit 1
          fi
          if ! grep -Eq '\bPropType\b' "$core_dts"; then
            echo "error: runtime-core@$pinned missing PropType (hollow?)" >&2
            exit 1
          fi
          if ! grep -Eq '\btoRef\b' "$react_dts"; then
            echo "error: reactivity@$pinned missing toRef (hollow?)" >&2
            exit 1
          fi
          core_bytes="$(wc -c < "$core_dts" | tr -d ' ')"
          if [[ "$core_bytes" -lt 10000 ]]; then
            echo "error: runtime-core@$pinned too small (${core_bytes} bytes); expected full .d.ts" >&2
            exit 1
          fi
          echo "Vue type-fetch graph OK (vue@$pinned, runtime-core ${core_bytes} bytes)"

  typecheck-shard:
    name: main / typecheck-shard (${{ matrix.module }})
    if: ${{ needs.discover-modules.outputs.modules_json != '[]' }}
    needs:
      - prepare-embedded-assets
      - prepare-root-node-modules
      - discover-modules
      - build-choysum-cli
      - prepare-typecheck-types
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.modules_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download and extract embedded assets
        uses: ./.github/actions/download-extract-embedded-assets
        with:
          artifact-name: main-embedded-assets
          archive-path: .choysum/tmp/main-embedded-assets.tar.gz

      - name: Download root node_modules
        uses: actions/download-artifact@v8
        with:
          name: main-root-node-modules
          path: .choysum/tmp

      - name: Extract root node_modules
        run: tar -xzf .choysum/tmp/main-root-node-modules.tar.gz -C .

      - name: Add local node_modules bin to PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Download choysum CLI
        uses: actions/download-artifact@v8
        with:
          name: main-choysum-cli
          path: .choysum/tmp

      - name: Make choysum CLI executable
        run: chmod +x .choysum/tmp/choysum

      - name: Setup CLI testing pkg cache
        uses: ./.github/actions/setup-cli-testing-cache

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run module typecheck
        run: |
          CHOYSUM_BIN="$(pwd)/.choysum/tmp/choysum"
          "$CHOYSUM_BIN" test typecheck ${{ matrix.module }}

  typecheck-all:
    name: main / typecheck-all
    needs:
      - discover-modules
      - typecheck-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip typecheck aggregate when no modules are discovered
        if: ${{ needs.discover-modules.outputs.modules_json == '[]' }}
        run: 'echo "typecheck skipped: no modules discovered"'

      - name: Verify typecheck matrix result
        if: ${{ needs.discover-modules.outputs.modules_json != '[]' }}
        run: |
          echo "typecheck-shard result=${{ needs.typecheck-shard.result }}"
          if [ "${{ needs.typecheck-shard.result }}" != "success" ]; then
            exit 1
          fi

  unit-shard:
    name: main / unit-shard (${{ matrix.module }})
    if: ${{ needs.discover-modules.outputs.modules_json != '[]' }}
    needs:
      - prepare-embedded-assets
      - prepare-root-node-modules
      - discover-modules
      - build-choysum-cli
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.modules_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download and extract embedded assets
        uses: ./.github/actions/download-extract-embedded-assets
        with:
          artifact-name: main-embedded-assets
          archive-path: .choysum/tmp/main-embedded-assets.tar.gz

      - name: Download root node_modules
        uses: actions/download-artifact@v8
        with:
          name: main-root-node-modules
          path: .choysum/tmp

      - name: Extract root node_modules
        run: tar -xzf .choysum/tmp/main-root-node-modules.tar.gz -C .

      - name: Add local node_modules bin to PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Download choysum CLI
        uses: actions/download-artifact@v8
        with:
          name: main-choysum-cli
          path: .choysum/tmp

      - name: Make choysum CLI executable
        run: chmod +x .choysum/tmp/choysum

      - name: Setup CLI testing pkg cache
        uses: ./.github/actions/setup-cli-testing-cache

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run unit tests with coverage and JUnit
        id: unit_tests
        run: |
          coverage_root=".choysum/coverage/main/unit/${{ matrix.module }}"
          junit_root=".choysum/test-results/main/unit"
          backend_lcov="$coverage_root/lcov.info"
          frontend_lcov="$coverage_root/fe/${{ matrix.module }}/lcov.info"
          backend_junit="$junit_root/${{ matrix.module }}.backend.junit.xml"
          frontend_junit="$junit_root/${{ matrix.module }}.frontend.junit.xml"

          mkdir -p "$coverage_root" "$junit_root"

          set +e
          CHOYSUM_BIN="$(pwd)/.choysum/tmp/choysum"
          "$CHOYSUM_BIN" test unit "${{ matrix.module }}" \
            --coverage \
            --coverage-report \
            --fe-coverage-all \
            --coverage-report-dir "$coverage_root" \
            --coverage-reporters lcovonly \
            --junit "$junit_root/${{ matrix.module }}.{scope}.junit.xml"
          exit_code=$?
          set -e

          coverage_files=""
          if [ -s "$backend_lcov" ]; then
            coverage_files="$backend_lcov"
          fi
          if [ -s "$frontend_lcov" ]; then
            if [ -n "$coverage_files" ]; then
              coverage_files="$coverage_files,$frontend_lcov"
            else
              coverage_files="$frontend_lcov"
            fi
          fi

          test_result_files=""
          if [ -f "$backend_junit" ]; then
            test_result_files="$backend_junit"
          fi
          if [ -f "$frontend_junit" ]; then
            if [ -n "$test_result_files" ]; then
              test_result_files="$test_result_files,$frontend_junit"
            else
              test_result_files="$frontend_junit"
            fi
          fi

          echo "coverage_files=$coverage_files" >> "$GITHUB_OUTPUT"
          echo "test_result_files=$test_result_files" >> "$GITHUB_OUTPUT"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      # Coverage (BE+FE) in one upload; test_results stay separate (different report_type).
      - name: Upload unit coverage to Codecov
        if: ${{ !cancelled() && steps.unit_tests.outputs.coverage_files != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: false
          files: ${{ steps.unit_tests.outputs.coverage_files }}
          name: mainline-unit-${{ matrix.module }}-coverage
          use_oidc: true
          verbose: true

      - name: Upload unit test results to Codecov
        if: ${{ !cancelled() && steps.unit_tests.outputs.test_result_files != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: false
          files: ${{ steps.unit_tests.outputs.test_result_files }}
          name: mainline-unit-${{ matrix.module }}-tests
          report_type: test_results
          use_oidc: true
          verbose: true

      - name: Fail unit shard if tests failed
        if: ${{ steps.unit_tests.outputs.exit_code != '0' }}
        run: exit "${{ steps.unit_tests.outputs.exit_code }}"

  unit-all:
    name: main / unit-all
    needs:
      - discover-modules
      - unit-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip unit aggregate when no modules are discovered
        if: ${{ needs.discover-modules.outputs.modules_json == '[]' }}
        run: 'echo "unit skipped: no modules discovered"'

      - name: Verify unit matrix result
        if: ${{ needs.discover-modules.outputs.modules_json != '[]' }}
        run: |
          echo "unit-shard result=${{ needs.unit-shard.result }}"
          if [ "${{ needs.unit-shard.result }}" != "success" ]; then
            exit 1
          fi

  e2e-shard:
    name: main / e2e-shard (${{ matrix.module }})
    if: ${{ needs.discover-modules.outputs.e2e_modules_json != '[]' }}
    needs:
      - prepare-embedded-assets
      - prepare-root-node-modules
      - prepare-playwright-cache
      - discover-modules
      - build-choysum-cli
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.e2e_modules_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download and extract embedded assets
        uses: ./.github/actions/download-extract-embedded-assets
        with:
          artifact-name: main-embedded-assets
          archive-path: .choysum/tmp/main-embedded-assets.tar.gz

      - name: Download root node_modules
        uses: actions/download-artifact@v8
        with:
          name: main-root-node-modules
          path: .choysum/tmp

      - name: Extract root node_modules
        run: tar -xzf .choysum/tmp/main-root-node-modules.tar.gz -C .

      - name: Add local node_modules bin to PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Download choysum CLI
        uses: actions/download-artifact@v8
        with:
          name: main-choysum-cli
          path: .choysum/tmp

      - name: Make choysum CLI executable
        run: chmod +x .choysum/tmp/choysum

      - name: Setup CLI testing pkg cache
        uses: ./.github/actions/setup-cli-testing-cache

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run E2E suite
        run: |
          CHOYSUM_BIN="$(pwd)/.choysum/tmp/choysum"
          "$CHOYSUM_BIN" test e2e ${{ matrix.module }}

  e2e-all:
    name: main / e2e-all
    needs:
      - discover-modules
      - e2e-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip E2E aggregate when no runnable modules are discovered
        if: ${{ needs.discover-modules.outputs.e2e_modules_json == '[]' }}
        run: 'echo "e2e skipped: no runnable modules discovered"'

      - name: Verify E2E matrix result
        if: ${{ needs.discover-modules.outputs.e2e_modules_json != '[]' }}
        run: |
          echo "e2e-shard result=${{ needs.e2e-shard.result }}"
          if [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            exit 1
          fi

  bootstrap-verify:
    name: main / bootstrap-verify
    uses: ./.github/workflows/bootstrap-verify.yml
