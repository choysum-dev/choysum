name: Mainline Verify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mainline-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-embedded-assets:
    name: main / prepare-embedded-assets
    uses: ./.github/workflows/prepare-embedded-assets.yml
    with:
      artifact_name: main-embedded-assets
      archive_path: .choysum/tmp/main-embedded-assets.tar.gz
      retention_days: 1

  discover-modules:
    name: main / discover-modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      modules_json: ${{ steps.discover.outputs.modules_json }}
      e2e_modules_json: ${{ steps.discover.outputs.e2e_modules_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Discover module matrices
        id: discover
        run: |
          set -euo pipefail
          python3 scripts/ci/module_matrix_discovery.py discover-mainline

  build-choysum-cli:
    name: main / build-choysum-cli
    needs:
      - prepare-embedded-assets
    uses: ./.github/workflows/build-choysum-cli.yml
    with:
      embedded_assets_artifact_name: main-embedded-assets
      embedded_assets_archive_path: .choysum/tmp/main-embedded-assets.tar.gz
      choysum_artifact_name: main-choysum-cli
      choysum_binary_path: .choysum/tmp/choysum
      retention_days: 1
      warm_typecheck_types: "true"
      modules_tsconfig_artifact_name: main-modules-tsconfig

  go-test-shards:
    name: main / go-test (${{ matrix.shard }})
    needs:
      - prepare-embedded-assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: testing
            chromium: "true"
          - shard: module
            chromium: "false"
          - shard: runtime
            chromium: "false"
          - shard: rest
            chromium: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download and extract embedded assets
        uses: ./.github/actions/download-extract-embedded-assets
        with:
          artifact-name: main-embedded-assets
          archive-path: .choysum/tmp/main-embedded-assets.tar.gz

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go-test shard partition
        if: ${{ matrix.shard == 'testing' }}
        run: |
          set -euo pipefail
          python3 scripts/ci/go_test_shards_test.py
          python3 scripts/ci/go_test_shards.py check

      - name: Install Chromium for e2e unit coverage
        if: ${{ matrix.chromium == 'true' }}
        run: |
          set -euo pipefail
          python3 scripts/ci/install_chromium.py
          echo "CHOYSUM_HOME=${CHOYSUM_HOME:-$HOME/.choysum}" >> "$GITHUB_ENV"

      # Coverage compile already typechecks; a separate `go build ./...` only doubles wall clock.
      - name: Run go test shard
        run: |
          set -euo pipefail
          mkdir -p .choysum/coverage/main
          if ! pkg_list="$(python3 scripts/ci/go_test_shards.py packages "${{ matrix.shard }}")"; then
            echo "error: failed to resolve packages for shard ${{ matrix.shard }}" >&2
            exit 1
          fi
          if [[ -z "${pkg_list}" ]]; then
            echo "error: shard ${{ matrix.shard }} has no packages" >&2
            exit 1
          fi
          mapfile -t pkgs <<< "${pkg_list}"
          ./scripts/ci/record_cmd_wall.sh \
            go test "${pkgs[@]}" -count=1 -covermode=atomic \
            -coverprofile=".choysum/coverage/main/shard-${{ matrix.shard }}.out"

      - name: Upload shard coverprofile
        uses: actions/upload-artifact@v7
        with:
          name: main-go-cover-${{ matrix.shard }}
          path: .choysum/coverage/main/shard-${{ matrix.shard }}.out
          if-no-files-found: error
          retention-days: 1

  go-test:
    name: main / go-test
    needs:
      - go-test-shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify go-test shards
        env:
          SHARD_RESULT: ${{ needs.go-test-shards.result }}
        run: |
          set -euo pipefail
          echo "go-test-shards result=${SHARD_RESULT}"
          if [[ "${SHARD_RESULT}" != "success" ]]; then
            {
              echo "### go-test shards failed"
              echo
              echo "Aggregate check \`main / go-test\` is red because one or more matrix jobs failed."
              echo "Inspect jobs named \`main / go-test (<shard>)\` — shards: \`testing\`, \`module\`, \`runtime\`, \`rest\`."
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}" || true
            echo "One or more go-test shards failed (result=${SHARD_RESULT})." >&2
            echo "Inspect matrix jobs: main / go-test (testing|module|runtime|rest)." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download shard coverprofiles
        uses: actions/download-artifact@v8
        with:
          pattern: main-go-cover-*
          path: .choysum/coverage/main/shards
          merge-multiple: true

      - name: Merge coverprofiles
        run: |
          set -euo pipefail
          mkdir -p .choysum/coverage/main
          mapfile -t inputs < <(find .choysum/coverage/main/shards -type f -name 'shard-*.out' | sort)
          if [[ ${#inputs[@]} -eq 0 ]]; then
            echo "error: no shard coverprofiles downloaded" >&2
            exit 1
          fi
          python3 scripts/ci/go_test_shards.py merge-coverprofiles \
            --require-all-shards \
            -o .choysum/coverage/main/go.out "${inputs[@]}"
          ls -la .choysum/coverage/main/go.out

      - name: Upload Go coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: false
          files: .choysum/coverage/main/go.out
          name: mainline-go
          use_oidc: true
          verbose: true

  typecheck-shard:
    name: main / typecheck-shard (${{ matrix.module }})
    if: ${{ needs.discover-modules.outputs.modules_json != '[]' }}
    needs:
      - discover-modules
      - build-choysum-cli
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.modules_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download choysum CLI
        uses: actions/download-artifact@v8
        with:
          name: main-choysum-cli
          path: .choysum/tmp

      - name: Make choysum CLI executable
        run: chmod +x .choysum/tmp/choysum

      - name: Setup CLI testing pkg cache
        uses: ./.github/actions/setup-cli-testing-cache

      - name: Download modules tsconfig path maps
        uses: actions/download-artifact@v8
        with:
          name: main-modules-tsconfig
          path: modules

      - name: Run module typecheck
        run: |
          CHOYSUM_BIN="$(pwd)/.choysum/tmp/choysum"
          "$CHOYSUM_BIN" test typecheck ${{ matrix.module }}

  typecheck-all:
    name: main / typecheck-all
    needs:
      - discover-modules
      - typecheck-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip typecheck aggregate when no modules are discovered
        if: ${{ needs.discover-modules.outputs.modules_json == '[]' }}
        run: 'echo "typecheck skipped: no modules discovered"'

      - name: Verify typecheck matrix result
        if: ${{ needs.discover-modules.outputs.modules_json != '[]' }}
        run: |
          echo "typecheck-shard result=${{ needs.typecheck-shard.result }}"
          if [ "${{ needs.typecheck-shard.result }}" != "success" ]; then
            exit 1
          fi

  unit-shard:
    name: main / unit-shard (${{ matrix.module }})
    if: ${{ needs.discover-modules.outputs.modules_json != '[]' }}
    needs:
      - discover-modules
      - build-choysum-cli
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.modules_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download choysum CLI
        uses: actions/download-artifact@v8
        with:
          name: main-choysum-cli
          path: .choysum/tmp

      - name: Make choysum CLI executable
        run: chmod +x .choysum/tmp/choysum

      - name: Setup CLI testing pkg cache
        uses: ./.github/actions/setup-cli-testing-cache

      - name: Run unit tests with coverage and JUnit
        id: unit_tests
        env:
          MODULE: ${{ matrix.module }}
        run: |
          coverage_root=".choysum/coverage/main/unit/$MODULE"
          junit_root=".choysum/test-results/main/unit"

          mkdir -p "$coverage_root" "$junit_root"

          set +e
          CHOYSUM_BIN="$(pwd)/.choysum/tmp/choysum"
          "$CHOYSUM_BIN" test unit "$MODULE" \
            --coverage \
            --coverage-report \
            --fe-coverage-all \
            --coverage-report-dir "$coverage_root" \
            --coverage-reporters lcovonly \
            --junit "$junit_root/$MODULE.{scope}.junit.xml"
          exit_code=$?
          set -e

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      # Upload the unit/ parent so merge-multiple keeps per-module directories.
      - name: Upload unit coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: main-unit-cover-${{ matrix.module }}
          path: .choysum/coverage/main/unit
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload unit junit artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: main-unit-junit-${{ matrix.module }}
          path: .choysum/test-results/main/unit
          if-no-files-found: ignore
          retention-days: 1

      - name: Fail unit shard if tests failed
        if: ${{ steps.unit_tests.outputs.exit_code != '0' }}
        run: exit "${{ steps.unit_tests.outputs.exit_code }}"

  unit-all:
    name: main / unit-all
    needs:
      - discover-modules
      - unit-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Skip unit aggregate when no modules are discovered
        if: ${{ needs.discover-modules.outputs.modules_json == '[]' }}
        run: 'echo "unit skipped: no modules discovered"'

      - name: Download unit coverage artifacts
        if: ${{ needs.discover-modules.outputs.modules_json != '[]' && needs.unit-shard.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: main-unit-cover-*
          path: .choysum/coverage/main/unit
          merge-multiple: true

      - name: Download unit junit artifacts
        if: ${{ needs.discover-modules.outputs.modules_json != '[]' && needs.unit-shard.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: main-unit-junit-*
          path: .choysum/test-results/main/unit
          merge-multiple: true

      - name: Collect unit coverage and junit paths
        id: collect_codecov
        if: ${{ needs.discover-modules.outputs.modules_json != '[]' && needs.unit-shard.result != 'skipped' }}
        run: |
          set -euo pipefail
          coverage_files=""
          while IFS= read -r f; do
            if [[ -n "$coverage_files" ]]; then
              coverage_files="${coverage_files},${f}"
            else
              coverage_files="${f}"
            fi
          done < <(find .choysum/coverage/main/unit -type f -name 'lcov.info' -size +0c 2>/dev/null | sort || true)

          test_result_files=""
          while IFS= read -r f; do
            if [[ -n "$test_result_files" ]]; then
              test_result_files="${test_result_files},${f}"
            else
              test_result_files="${f}"
            fi
          done < <(find .choysum/test-results/main/unit -type f -name '*.junit.xml' 2>/dev/null | sort || true)

          if [[ -z "$coverage_files" ]]; then
            echo "::warning title=unit coverage::no lcov.info collected although modules were discovered (Codecov upload will be skipped)"
          fi

          echo "coverage_files=${coverage_files}" >> "$GITHUB_OUTPUT"
          echo "test_result_files=${test_result_files}" >> "$GITHUB_OUTPUT"

      - name: Upload unit coverage to Codecov
        if: ${{ needs.discover-modules.outputs.modules_json != '[]' && needs.unit-shard.result != 'skipped' && steps.collect_codecov.outputs.coverage_files != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: false
          files: ${{ steps.collect_codecov.outputs.coverage_files }}
          name: mainline-unit
          use_oidc: true
          verbose: true

      - name: Upload unit test results to Codecov
        if: ${{ needs.discover-modules.outputs.modules_json != '[]' && needs.unit-shard.result != 'skipped' && steps.collect_codecov.outputs.test_result_files != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: false
          files: ${{ steps.collect_codecov.outputs.test_result_files }}
          name: mainline-unit
          report_type: test_results
          use_oidc: true
          verbose: true

      - name: Verify unit matrix result
        if: ${{ needs.discover-modules.outputs.modules_json != '[]' }}
        run: |
          echo "unit-shard result=${{ needs.unit-shard.result }}"
          if [ "${{ needs.unit-shard.result }}" != "success" ]; then
            exit 1
          fi

  e2e-shard:
    name: main / e2e-shard (${{ matrix.module }})
    if: ${{ needs.discover-modules.outputs.e2e_modules_json != '[]' }}
    needs:
      - discover-modules
      - build-choysum-cli
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.e2e_modules_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download choysum CLI
        uses: actions/download-artifact@v8
        with:
          name: main-choysum-cli
          path: .choysum/tmp

      - name: Make choysum CLI executable
        run: chmod +x .choysum/tmp/choysum

      - name: Setup CLI testing pkg cache
        uses: ./.github/actions/setup-cli-testing-cache

      - name: Setup Chromium
        uses: ./.github/actions/setup-chromium

      - name: Run E2E suite
        env:
          CHOYSUM_BIN: ${{ github.workspace }}/.choysum/tmp/choysum
          MODULE: ${{ matrix.module }}
          E2E_MAX_ATTEMPTS: "2"
        run: bash scripts/ci/run_e2e_with_retry.sh

  e2e-all:
    name: main / e2e-all
    needs:
      - discover-modules
      - e2e-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip E2E aggregate when no runnable modules are discovered
        if: ${{ needs.discover-modules.outputs.e2e_modules_json == '[]' }}
        run: 'echo "e2e skipped: no runnable modules discovered"'

      - name: Verify E2E matrix result
        if: ${{ needs.discover-modules.outputs.e2e_modules_json != '[]' }}
        run: |
          echo "e2e-shard result=${{ needs.e2e-shard.result }}"
          if [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            exit 1
          fi
