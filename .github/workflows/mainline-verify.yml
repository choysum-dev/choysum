name: Mainline Verify

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to run Mainline Verify against
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mainline-verify-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  prepare-embedded-assets:
    name: main / prepare-embedded-assets
    uses: ./.github/workflows/prepare-embedded-assets.yml
    with:
      run_ref: ${{ inputs.ref || github.ref }}
      artifact_name: main-embedded-assets
      archive_path: .choysum/tmp/main-embedded-assets.tar.gz
      retention_days: 1

  prepare-root-node-modules:
    name: main / prepare-root-node-modules
    uses: ./.github/workflows/prepare-root-node-modules.yml
    with:
      run_ref: ${{ inputs.ref || github.ref }}
      artifact_name: main-root-node-modules
      archive_path: .choysum/tmp/main-root-node-modules.tar.gz
      retention_days: 1

  discover-modules:
    name: main / discover-modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      modules_json: ${{ steps.discover.outputs.modules_json }}
      e2e_modules_json: ${{ steps.discover.outputs.e2e_modules_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Discover module matrices
        id: discover
        run: |
          set -euo pipefail
          python3 scripts/ci/module_matrix_discovery.py discover-mainline

  build-choysum-cli:
    name: main / build-choysum-cli
    needs:
      - prepare-embedded-assets
    uses: ./.github/workflows/build-choysum-cli.yml
    with:
      run_ref: ${{ inputs.ref || github.ref }}
      embedded_assets_artifact_name: main-embedded-assets
      embedded_assets_archive_path: .choysum/tmp/main-embedded-assets.tar.gz
      choysum_artifact_name: main-choysum-cli
      choysum_binary_path: .choysum/tmp/choysum
      retention_days: 1

  go-test:
    name: main / go-test
    needs:
      - prepare-embedded-assets
      - prepare-root-node-modules
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download and extract embedded assets
        uses: ./.github/actions/download-extract-embedded-assets
        with:
          artifact-name: main-embedded-assets
          archive-path: .choysum/tmp/main-embedded-assets.tar.gz

      - name: Download root node_modules
        uses: actions/download-artifact@v8
        with:
          name: main-root-node-modules
          path: .choysum/tmp

      - name: Extract root node_modules
        run: tar -xzf .choysum/tmp/main-root-node-modules.tar.gz -C .

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run go build
        run: go build ./...

      - name: Run go test
        run: go test ./... -count=1

  typecheck-shard:
    name: main / typecheck-shard (${{ matrix.module }})
    if: ${{ needs.discover-modules.outputs.modules_json != '[]' }}
    needs:
      - prepare-embedded-assets
      - prepare-root-node-modules
      - discover-modules
      - build-choysum-cli
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.modules_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download and extract embedded assets
        uses: ./.github/actions/download-extract-embedded-assets
        with:
          artifact-name: main-embedded-assets
          archive-path: .choysum/tmp/main-embedded-assets.tar.gz

      - name: Download root node_modules
        uses: actions/download-artifact@v8
        with:
          name: main-root-node-modules
          path: .choysum/tmp

      - name: Extract root node_modules
        run: tar -xzf .choysum/tmp/main-root-node-modules.tar.gz -C .

      - name: Add local node_modules bin to PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Download choysum CLI
        uses: actions/download-artifact@v8
        with:
          name: main-choysum-cli
          path: .choysum/tmp

      - name: Make choysum CLI executable
        run: chmod +x .choysum/tmp/choysum

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run module typecheck
        run: |
          CHOYSUM_BIN="$(pwd)/.choysum/tmp/choysum"
          "$CHOYSUM_BIN" test typecheck ${{ matrix.module }}

  typecheck-all:
    name: main / typecheck-all
    needs:
      - discover-modules
      - typecheck-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip typecheck aggregate when no modules are discovered
        if: ${{ needs.discover-modules.outputs.modules_json == '[]' }}
        run: 'echo "typecheck skipped: no modules discovered"'

      - name: Verify typecheck matrix result
        if: ${{ needs.discover-modules.outputs.modules_json != '[]' }}
        run: |
          echo "typecheck-shard result=${{ needs.typecheck-shard.result }}"
          if [ "${{ needs.typecheck-shard.result }}" != "success" ]; then
            exit 1
          fi

  unit-shard:
    name: main / unit-shard (${{ matrix.module }})
    if: ${{ needs.discover-modules.outputs.modules_json != '[]' }}
    needs:
      - prepare-embedded-assets
      - prepare-root-node-modules
      - discover-modules
      - build-choysum-cli
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.modules_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download and extract embedded assets
        uses: ./.github/actions/download-extract-embedded-assets
        with:
          artifact-name: main-embedded-assets
          archive-path: .choysum/tmp/main-embedded-assets.tar.gz

      - name: Download root node_modules
        uses: actions/download-artifact@v8
        with:
          name: main-root-node-modules
          path: .choysum/tmp

      - name: Extract root node_modules
        run: tar -xzf .choysum/tmp/main-root-node-modules.tar.gz -C .

      - name: Add local node_modules bin to PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Download choysum CLI
        uses: actions/download-artifact@v8
        with:
          name: main-choysum-cli
          path: .choysum/tmp

      - name: Make choysum CLI executable
        run: chmod +x .choysum/tmp/choysum

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run unit suite
        run: |
          CHOYSUM_BIN="$(pwd)/.choysum/tmp/choysum"
          "$CHOYSUM_BIN" test unit ${{ matrix.module }}

  unit-all:
    name: main / unit-all
    needs:
      - discover-modules
      - unit-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip unit aggregate when no modules are discovered
        if: ${{ needs.discover-modules.outputs.modules_json == '[]' }}
        run: 'echo "unit skipped: no modules discovered"'

      - name: Verify unit matrix result
        if: ${{ needs.discover-modules.outputs.modules_json != '[]' }}
        run: |
          echo "unit-shard result=${{ needs.unit-shard.result }}"
          if [ "${{ needs.unit-shard.result }}" != "success" ]; then
            exit 1
          fi

  e2e-shard:
    name: main / e2e-shard (${{ matrix.module }})
    if: ${{ needs.discover-modules.outputs.e2e_modules_json != '[]' }}
    needs:
      - prepare-embedded-assets
      - prepare-root-node-modules
      - discover-modules
      - build-choysum-cli
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.e2e_modules_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download and extract embedded assets
        uses: ./.github/actions/download-extract-embedded-assets
        with:
          artifact-name: main-embedded-assets
          archive-path: .choysum/tmp/main-embedded-assets.tar.gz

      - name: Download root node_modules
        uses: actions/download-artifact@v8
        with:
          name: main-root-node-modules
          path: .choysum/tmp

      - name: Extract root node_modules
        run: tar -xzf .choysum/tmp/main-root-node-modules.tar.gz -C .

      - name: Add local node_modules bin to PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Download choysum CLI
        uses: actions/download-artifact@v8
        with:
          name: main-choysum-cli
          path: .choysum/tmp

      - name: Make choysum CLI executable
        run: chmod +x .choysum/tmp/choysum

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Cache Playwright browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: |
          CHOYSUM_BIN="$(pwd)/.choysum/tmp/choysum"
          "$CHOYSUM_BIN" test e2e ${{ matrix.module }}

  e2e-all:
    name: main / e2e-all
    needs:
      - discover-modules
      - e2e-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip E2E aggregate when no runnable modules are discovered
        if: ${{ needs.discover-modules.outputs.e2e_modules_json == '[]' }}
        run: 'echo "e2e skipped: no runnable modules discovered"'

      - name: Verify E2E matrix result
        if: ${{ needs.discover-modules.outputs.e2e_modules_json != '[]' }}
        run: |
          echo "e2e-shard result=${{ needs.e2e-shard.result }}"
          if [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            exit 1
          fi

  bootstrap-verify:
    name: main / bootstrap-verify
    needs:
      - prepare-embedded-assets
    uses: ./.github/workflows/bootstrap-verify.yml
    with:
      run_ref: ${{ inputs.ref || github.ref }}
      embedded_assets_artifact_name: main-embedded-assets
      embedded_assets_archive_path: .choysum/tmp/main-embedded-assets.tar.gz