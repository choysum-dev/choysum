name: Nightly Audit

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to run Nightly Audit against
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-audit-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  addon-package-contract:
    name: nightly / addon-package-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Verify addon package contract
        run: python3 scripts/dev/check-addon-package-contract.py

  prepare-embedded-assets:
    name: nightly / prepare-embedded-assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            internal/bootstrap/web/package-lock.json
            pkg/jsengine/scripts/vuesfc/package-lock.json

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Vue SFC npm dependencies
        working-directory: pkg/jsengine/scripts/vuesfc
        run: npm ci

      - name: Build Vue SFC embed asset
        working-directory: pkg/jsengine/scripts/vuesfc
        run: npm run build

      - name: Install bootstrap npm dependencies
        working-directory: internal/bootstrap/web
        run: npm ci

      - name: Build bootstrap dist
        working-directory: internal/bootstrap/web
        run: npm run build

      - name: Pack embedded assets
        run: |
          mkdir -p .choysum/tmp
          tar -czf .choysum/tmp/nightly-embedded-assets.tar.gz \
            internal/bootstrap/web/dist \
            pkg/jsengine/scripts/vuesfc/dist/index.js

      - name: Upload embedded assets
        uses: actions/upload-artifact@v7
        with:
          name: nightly-embedded-assets
          path: .choysum/tmp/nightly-embedded-assets.tar.gz
          if-no-files-found: error
          retention-days: 1

  prepare-root-node-modules:
    name: nightly / prepare-root-node-modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Pack root node_modules
        run: |
          mkdir -p .choysum/tmp
          tar -czf .choysum/tmp/nightly-root-node-modules.tar.gz node_modules

      - name: Upload root node_modules
        uses: actions/upload-artifact@v7
        with:
          name: nightly-root-node-modules
          path: .choysum/tmp/nightly-root-node-modules.tar.gz
          if-no-files-found: error
          retention-days: 1

  discover-modules:
    name: nightly / discover-modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      e2e_modules_json: ${{ steps.discover.outputs.e2e_modules_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Discover runnable E2E modules
        id: discover
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import pathlib

          repo_root = pathlib.Path.cwd()
          addons_root = repo_root / "addons"
          ignored_modules = {".choysum", "tmp"}

          e2e_modules = []
          if addons_root.is_dir():
              for child in sorted(addons_root.iterdir(), key=lambda entry: entry.name):
                  if not child.is_dir() or child.name in ignored_modules:
                      continue

                    package_path = child / "package.json"
                    if not package_path.is_file():
                      continue

                    package_json = json.loads(package_path.read_text(encoding="utf-8"))
                    choysum = package_json.get("choysum") if isinstance(package_json, dict) else {}
                    e2e = choysum.get("e2e") if isinstance(choysum, dict) else {}
                  specs = e2e.get("specs") if isinstance(e2e, dict) else ""
                  if isinstance(specs, str) and specs.strip():
                      e2e_modules.append(child.name)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              print(
                  "e2e_modules_json=" + json.dumps(e2e_modules, separators=(",", ":")),
                  file=fh,
              )
          PY

  build-choysum-cli:
    name: nightly / build-choysum-cli
    needs:
      - prepare-embedded-assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download embedded assets
        uses: actions/download-artifact@v8
        with:
          name: nightly-embedded-assets
          path: .choysum/tmp

      - name: Extract embedded assets
        run: tar -xzf .choysum/tmp/nightly-embedded-assets.tar.gz -C .

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build choysum CLI
        run: |
          mkdir -p .choysum/tmp
          go build -o .choysum/tmp/choysum .

      - name: Upload choysum CLI
        uses: actions/upload-artifact@v7
        with:
          name: nightly-choysum-cli
          path: .choysum/tmp/choysum
          if-no-files-found: error
          retention-days: 1

  e2e-shard:
    name: nightly / e2e-shard (${{ matrix.module }})
    if: ${{ needs.discover-modules.outputs.e2e_modules_json != '[]' }}
    needs:
      - prepare-embedded-assets
      - prepare-root-node-modules
      - discover-modules
      - build-choysum-cli
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.e2e_modules_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download embedded assets
        uses: actions/download-artifact@v8
        with:
          name: nightly-embedded-assets
          path: .choysum/tmp

      - name: Extract embedded assets
        run: tar -xzf .choysum/tmp/nightly-embedded-assets.tar.gz -C .

      - name: Download root node_modules
        uses: actions/download-artifact@v8
        with:
          name: nightly-root-node-modules
          path: .choysum/tmp

      - name: Extract root node_modules
        run: tar -xzf .choysum/tmp/nightly-root-node-modules.tar.gz -C .

      - name: Download choysum CLI
        uses: actions/download-artifact@v8
        with:
          name: nightly-choysum-cli
          path: .choysum/tmp

      - name: Make choysum CLI executable
        run: chmod +x .choysum/tmp/choysum

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: |
          CHOYSUM_BIN="$(pwd)/.choysum/tmp/choysum"
          "$CHOYSUM_BIN" test e2e ${{ matrix.module }}

  e2e-all:
    name: nightly / e2e-all
    needs:
      - discover-modules
      - e2e-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip E2E aggregate when no runnable modules are discovered
        if: ${{ needs.discover-modules.outputs.e2e_modules_json == '[]' }}
        run: 'echo "e2e skipped: no runnable modules discovered"'

      - name: Verify E2E matrix result
        if: ${{ needs.discover-modules.outputs.e2e_modules_json != '[]' }}
        run: |
          echo "e2e-shard result=${{ needs.e2e-shard.result }}"
          if [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            exit 1
          fi

  bootstrap-verify:
    name: nightly / bootstrap-verify
    needs: prepare-embedded-assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download embedded assets
        uses: actions/download-artifact@v8
        with:
          name: nightly-embedded-assets
          path: .choysum/tmp

      - name: Extract embedded assets
        run: tar -xzf .choysum/tmp/nightly-embedded-assets.tar.gz -C .

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/bootstrap/web/package-lock.json

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install bootstrap npm dependencies
        working-directory: internal/bootstrap/web
        run: npm ci

      - name: Run bootstrap verify
        working-directory: internal/bootstrap/web
        run: npm run verify:bootstrap:release