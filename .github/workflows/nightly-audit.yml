name: Nightly Audit

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to run Nightly Audit against
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-audit-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  prepare-embedded-assets:
    name: nightly / prepare-embedded-assets
    uses: ./.github/workflows/prepare-embedded-assets.yml
    with:
      run_ref: ${{ inputs.ref || github.ref }}
      artifact_name: nightly-embedded-assets
      archive_path: .choysum/tmp/nightly-embedded-assets.tar.gz
      retention_days: 1

  prepare-root-node-modules:
    name: nightly / prepare-root-node-modules
    uses: ./.github/workflows/prepare-root-node-modules.yml
    with:
      run_ref: ${{ inputs.ref || github.ref }}
      artifact_name: nightly-root-node-modules
      archive_path: .choysum/tmp/nightly-root-node-modules.tar.gz
      retention_days: 1

  discover-modules:
    name: nightly / discover-modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      e2e_modules_json: ${{ steps.discover.outputs.e2e_modules_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Discover runnable E2E modules
        id: discover
        run: |
          set -euo pipefail
          python3 scripts/ci/module_matrix_discovery.py discover-nightly

  build-choysum-cli:
    name: nightly / build-choysum-cli
    needs:
      - prepare-embedded-assets
    uses: ./.github/workflows/build-choysum-cli.yml
    with:
      run_ref: ${{ inputs.ref || github.ref }}
      embedded_assets_artifact_name: nightly-embedded-assets
      embedded_assets_archive_path: .choysum/tmp/nightly-embedded-assets.tar.gz
      choysum_artifact_name: nightly-choysum-cli
      choysum_binary_path: .choysum/tmp/choysum
      retention_days: 1

  e2e-shard:
    name: nightly / e2e-shard (${{ matrix.module }})
    if: ${{ needs.discover-modules.outputs.e2e_modules_json != '[]' }}
    needs:
      - prepare-embedded-assets
      - prepare-root-node-modules
      - discover-modules
      - build-choysum-cli
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.e2e_modules_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download and extract embedded assets
        uses: ./.github/actions/download-extract-embedded-assets
        with:
          artifact-name: nightly-embedded-assets
          archive-path: .choysum/tmp/nightly-embedded-assets.tar.gz

      - name: Download root node_modules
        uses: actions/download-artifact@v8
        with:
          name: nightly-root-node-modules
          path: .choysum/tmp

      - name: Extract root node_modules
        run: tar -xzf .choysum/tmp/nightly-root-node-modules.tar.gz -C .

      - name: Download choysum CLI
        uses: actions/download-artifact@v8
        with:
          name: nightly-choysum-cli
          path: .choysum/tmp

      - name: Make choysum CLI executable
        run: chmod +x .choysum/tmp/choysum

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: |
          CHOYSUM_BIN="$(pwd)/.choysum/tmp/choysum"
          "$CHOYSUM_BIN" test e2e ${{ matrix.module }}

  e2e-all:
    name: nightly / e2e-all
    needs:
      - discover-modules
      - e2e-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip E2E aggregate when no runnable modules are discovered
        if: ${{ needs.discover-modules.outputs.e2e_modules_json == '[]' }}
        run: 'echo "e2e skipped: no runnable modules discovered"'

      - name: Verify E2E matrix result
        if: ${{ needs.discover-modules.outputs.e2e_modules_json != '[]' }}
        run: |
          echo "e2e-shard result=${{ needs.e2e-shard.result }}"
          if [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            exit 1
          fi

  bootstrap-verify:
    name: nightly / bootstrap-verify
    needs: prepare-embedded-assets
    uses: ./.github/workflows/bootstrap-verify.yml
    with:
      run_ref: ${{ inputs.ref || github.ref }}
      embedded_assets_artifact_name: nightly-embedded-assets
      embedded_assets_archive_path: .choysum/tmp/nightly-embedded-assets.tar.gz