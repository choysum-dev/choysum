name: Nightly Audit

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to run Nightly Audit against
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-audit-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  prepare-embedded-assets:
    name: nightly / prepare-embedded-assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            internal/bootstrap/web/package-lock.json
            pkg/jsengine/scripts/vuesfc/package-lock.json

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Vue SFC npm dependencies
        working-directory: pkg/jsengine/scripts/vuesfc
        run: npm ci

      - name: Build Vue SFC embed asset
        working-directory: pkg/jsengine/scripts/vuesfc
        run: npm run build

      - name: Install bootstrap npm dependencies
        working-directory: internal/bootstrap/web
        run: npm ci

      - name: Build bootstrap dist
        working-directory: internal/bootstrap/web
        run: npm run build

      - name: Pack embedded assets
        run: |
          mkdir -p .choysum/tmp
          tar -czf .choysum/tmp/nightly-embedded-assets.tar.gz \
            internal/bootstrap/web/dist \
            pkg/jsengine/scripts/vuesfc/dist/index.js

      - name: Upload embedded assets
        uses: actions/upload-artifact@v4
        with:
          name: nightly-embedded-assets
          path: .choysum/tmp/nightly-embedded-assets.tar.gz
          if-no-files-found: error
          retention-days: 1

  e2e-all:
    name: nightly / e2e-all
    needs: prepare-embedded-assets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download embedded assets
        uses: actions/download-artifact@v4
        with:
          name: nightly-embedded-assets
          path: .choysum/tmp

      - name: Extract embedded assets
        run: tar -xzf .choysum/tmp/nightly-embedded-assets.tar.gz -C .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: go run . test e2e --all

  coverage-report:
    name: nightly / coverage-report
    needs: prepare-embedded-assets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download embedded assets
        uses: actions/download-artifact@v4
        with:
          name: nightly-embedded-assets
          path: .choysum/tmp

      - name: Extract embedded assets
        run: tar -xzf .choysum/tmp/nightly-embedded-assets.tar.gz -C .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Generate coverage report
        env:
          CHOYSUM_COMPILE_MINIFY: "false"
        run: go run . test unit --all --coverage --coverage-report --coverage-report-dir .choysum/coverage/nightly --coverage-reporters lcovonly

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-report
          path: .choysum/coverage/nightly
          if-no-files-found: error
          retention-days: 14

  bootstrap-verify:
    name: nightly / bootstrap-verify
    needs: prepare-embedded-assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download embedded assets
        uses: actions/download-artifact@v4
        with:
          name: nightly-embedded-assets
          path: .choysum/tmp

      - name: Extract embedded assets
        run: tar -xzf .choysum/tmp/nightly-embedded-assets.tar.gz -C .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/bootstrap/web/package-lock.json

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install bootstrap npm dependencies
        working-directory: internal/bootstrap/web
        run: npm ci

      - name: Run bootstrap verify
        working-directory: internal/bootstrap/web
        run: npm run verify:bootstrap:release