name: Prepare Root Node Modules

on:
  workflow_call:
    inputs:
      run_ref:
        description: "Branch, tag, or SHA to checkout"
        required: true
        type: string
      artifact_name:
        description: "Artifact name to upload"
        required: true
        type: string
      archive_path:
        description: "Archive path to create and upload"
        required: true
        type: string
      retention_days:
        description: "Artifact retention days"
        required: true
        type: number
      docs_only:
        description: "Skip root node_modules preparation when docs-only routing is active"
        required: false
        default: "false"
        type: string

permissions:
  contents: read

jobs:
  prepare-root-node-modules:
    name: prepare-root-node-modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip root node_modules when docs-only routing is active
        if: ${{ inputs.docs_only == 'true' }}
        run: echo "root node_modules skipped by routing"

      - name: Checkout
        if: ${{ inputs.docs_only != 'true' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.run_ref }}

      - name: Setup Node
        if: ${{ inputs.docs_only != 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install root test toolchain dependencies
        if: ${{ inputs.docs_only != 'true' }}
        run: |
          set -euo pipefail
          deps_file=".choysum/tmp/root-node-modules-deps.txt"
          mkdir -p "$(dirname "$deps_file")"
          cat > "$deps_file" <<'EOF'
          @bufbuild/protobuf@^2.12.0
          @bufbuild/protoc-gen-es@2.12.0
          @connectrpc/connect-web@^2.1.2
          @element-plus/icons-vue@^2.3.2
          @opentelemetry/sdk-trace-base@^2.8.0
          @playwright/test@^1.60.0
          @types/moment-timezone@^0.5.30
          @types/node@^25.9.3
          @types/nprogress@^0.2.3
          @types/path-browserify@^1.0.3
          @vicons/material@^0.13.0
          @vitejs/plugin-vue@^6.0.7
          @vitest/coverage-v8@^4.1.8
          @vue/compiler-sfc@^3.5.20
          @vue/test-utils@^2.4.11
          @vueuse/core@^14.3.0
          async-validator@^4.2.5
          bcrypt@^6.0.0
          dayjs@^1.11.21
          decimal.js@^10.6.0
          echarts@^6.1.0
          element-plus@^2.14.2
          fast-deep-equal@^3.1.3
          happy-dom@^20.10.3
          istanbul-lib-instrument@^6.0.3
          jsonwebtoken@^9.0.0
          kysely@^0.29.2
          lru-cache@^11.5.1
          microdiff@^1.5.0
          moment-timezone@^0.6.2
          moment@^2.30.1
          nanoid@^5.1.11
          normalize.css@^8.0.1
          nprogress@^0.2.0
          nyc@^18.0.0
          pinia-plugin-persistedstate@^4.7.1
          pinia@^3.0.4
          sass-embedded@^1.100.0
          typescript@^6.0.3
          vite@^8.0.16
          vitest@^4.1.7
          vue-echarts@^8.0.1
          vue-i18n-extract@^2.0.7
          vue-i18n@^11.4.5
          vue-router@^5.1.0
          vue-tsc@^3.3.5
          vue-virtual-scroller@^3.0.4
          vue@^3.5.38
          vuedraggable@^4.1.0
          EOF
          xargs npm install --include=dev --no-package-lock --no-save < "$deps_file"

      - name: Pack root node_modules
        if: ${{ inputs.docs_only != 'true' }}
        run: |
          ARCHIVE_PATH="${{ inputs.archive_path }}"
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          tar -czf "$ARCHIVE_PATH" node_modules

      - name: Upload root node_modules
        if: ${{ inputs.docs_only != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.archive_path }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
