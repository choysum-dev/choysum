name: Prepare Root Node Modules

on:
  workflow_call:
    inputs:
      run_ref:
        description: "Branch, tag, or SHA to checkout"
        required: true
        type: string
      artifact_name:
        description: "Artifact name to upload"
        required: true
        type: string
      archive_path:
        description: "Archive path to create and upload"
        required: true
        type: string
      retention_days:
        description: "Artifact retention days"
        required: true
        type: number
      docs_only:
        description: "Skip root node_modules preparation when docs-only routing is active"
        required: false
        default: "false"
        type: string
      target_modules_json:
        description: "JSON array of module names used to scope dynamic dependency resolution; empty means all modules"
        required: false
        default: "[]"
        type: string

permissions:
  contents: read

jobs:
  prepare-root-node-modules:
    name: prepare-root-node-modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip root node_modules when docs-only routing is active
        if: ${{ inputs.docs_only == 'true' }}
        run: echo "root node_modules skipped by routing"

      - name: Checkout
        if: ${{ inputs.docs_only != 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.run_ref }}

      - name: Setup Node
        if: ${{ inputs.docs_only != 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install root test toolchain dependencies
        if: ${{ inputs.docs_only != 'true' }}
        run: |
          set -euo pipefail
          deps_file=".choysum/tmp/root-node-modules-deps.txt"
          mkdir -p "$(dirname "$deps_file")"

          python3 scripts/ci/compute_root_node_modules_deps.py \
            --modules-path modules \
            --target-modules-json '${{ inputs.target_modules_json }}' \
            --output "$deps_file"

          echo "Computed root node_modules dependencies ($(wc -l < "$deps_file") entries):"
          cat "$deps_file"

          xargs npm install --include=dev --no-package-lock --no-save < "$deps_file"

      - name: Pack root node_modules
        if: ${{ inputs.docs_only != 'true' }}
        run: |
          ARCHIVE_PATH="${{ inputs.archive_path }}"
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          tar -czf "$ARCHIVE_PATH" node_modules

      - name: Upload root node_modules
        if: ${{ inputs.docs_only != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.archive_path }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
