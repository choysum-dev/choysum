name: Prepare Root Node Modules

on:
  workflow_call:
    inputs:
      artifact_name:
        description: "Artifact name to upload"
        required: true
        type: string
      archive_path:
        description: "Archive path to create and upload"
        required: true
        type: string
      retention_days:
        description: "Artifact retention days"
        required: true
        type: number
      docs_only:
        description: "Skip root node_modules preparation when docs-only routing is active"
        required: false
        default: "false"
        type: string
      target_modules_json:
        description: "JSON array of module names used to scope dynamic dependency resolution; empty means all modules"
        required: false
        default: "[]"
        type: string

permissions:
  contents: read

jobs:
  prepare-root-node-modules:
    name: prepare-root-node-modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip root node_modules when docs-only routing is active
        if: ${{ inputs.docs_only == 'true' }}
        run: echo "root node_modules skipped by routing"

      - name: Checkout
        if: ${{ inputs.docs_only != 'true' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compute root node_modules dependencies
        id: deps
        if: ${{ inputs.docs_only != 'true' }}
        env:
          TARGET_MODULES_JSON: ${{ inputs.target_modules_json }}
          ARCHIVE_PATH: ${{ inputs.archive_path }}
        run: |
          set -euo pipefail
          deps_file=".choysum/tmp/root-node-modules-deps.txt"
          mkdir -p "$(dirname "$deps_file")" "$(dirname "$ARCHIVE_PATH")"

          python3 scripts/ci/compute_root_node_modules_deps.py \
            --modules-path modules \
            --target-modules-json "$TARGET_MODULES_JSON" \
            --output "$deps_file"

          deps_hash="$(sha256sum "$deps_file" | awk '{print $1}')"
          echo "Computed root node_modules dependencies ($(wc -l < "$deps_file") entries, hash=${deps_hash}):"
          cat "$deps_file"

          echo "deps_file=$deps_file" >> "$GITHUB_OUTPUT"
          echo "deps_hash=$deps_hash" >> "$GITHUB_OUTPUT"

      # Cache the packed archive (skip npm install + tar on hit).
      # Keyed by the computed deps list (toolchain pins + module ranges).
      - name: Restore root node_modules archive cache
        id: nm-cache
        if: ${{ inputs.docs_only != 'true' }}
        uses: actions/cache@v6
        with:
          path: ${{ inputs.archive_path }}
          key: ${{ runner.os }}-root-nm-v3-node22-npm10.9.4-${{ steps.deps.outputs.deps_hash }}

      - name: Setup Node
        if: ${{ inputs.docs_only != 'true' && steps.nm-cache.outputs.cache-hit != 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Pin npm for root node_modules install
        if: ${{ inputs.docs_only != 'true' && steps.nm-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          npm install -g npm@10.9.4
          npm --version

      - name: Install root test toolchain dependencies
        if: ${{ inputs.docs_only != 'true' && steps.nm-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          python3 scripts/ci/install_root_node_modules_deps.py \
            --deps-file "${{ steps.deps.outputs.deps_file }}" \
            --workspace "$PWD"

      - name: Pack root node_modules
        if: ${{ inputs.docs_only != 'true' && steps.nm-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="${{ inputs.archive_path }}"
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          tar -czf "$ARCHIVE_PATH" node_modules

      - name: Upload root node_modules
        if: ${{ inputs.docs_only != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.archive_path }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
