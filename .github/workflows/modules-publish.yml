name: Modules Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run publish flow without pushing npm packages"
        required: true
        default: true
        type: boolean
      target_module:
        description: "Single module name to target (empty means auto-discover changed modules)"
        required: false
        default: ""
        type: string
      target_ref:
        description: "Branch, tag, or SHA to run against"
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
    paths:
      - "modules/**"
      - ".github/workflows/modules-publish.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: modules-publish-${{ inputs.target_ref || github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: modules / preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run_ref: ${{ steps.resolve-ref.outputs.run_ref }}
      dry_run: ${{ steps.resolve-flags.outputs.dry_run }}
    steps:
      - name: Resolve run ref
        id: resolve-ref
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.target_ref }}" ]]; then
            echo "run_ref=${{ inputs.target_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve dry_run flag
        id: resolve-flags
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              echo "dry_run=true" >> "$GITHUB_OUTPUT"
            else
              echo "dry_run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # Safety default for push-triggered runs.
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate NPM publish secret presence
        env:
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NPM_PUBLISH_TOKEN:-}" ]]; then
            echo "NPM_PUBLISH_TOKEN is required for module publish workflow" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve-ref.outputs.run_ref }}
          fetch-depth: 0

      - name: Validate module metadata schema baseline
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import pathlib
          import sys

          repo_root = pathlib.Path.cwd()
          modules_root = repo_root / "modules"

          required_top = {"name", "version", "choysum", "publishConfig"}
          required_choysum = {"moduleName", "application", "entryPoints"}
          optional_entry_keys = {"service", "web"}

          errors = []
          for package_path in sorted(modules_root.glob("*/package.json")):
              module_dir_name = package_path.parent.name
              rel = package_path.relative_to(repo_root)
              data = json.loads(package_path.read_text(encoding="utf-8"))

              missing_top = sorted(required_top - set(data.keys()))
              if missing_top:
                  errors.append(f"{rel}: missing top-level keys: {', '.join(missing_top)}")
                  continue

              choysum = data.get("choysum")
              if not isinstance(choysum, dict):
                  errors.append(f"{rel}: choysum must be an object")
                  continue

              missing_choysum = sorted(required_choysum - set(choysum.keys()))
              if missing_choysum:
                  errors.append(f"{rel}: missing choysum keys: {', '.join(missing_choysum)}")
                  continue

              module_name = choysum.get("moduleName")
              if not isinstance(module_name, str) or not module_name.strip():
                  errors.append(f"{rel}: choysum.moduleName must be a non-empty string")
              elif module_name != module_dir_name:
                  errors.append(
                      f"{rel}: choysum.moduleName '{module_name}' must match directory name '{module_dir_name}'"
                  )

              entry_points = choysum.get("entryPoints")
              if not isinstance(entry_points, dict) or not entry_points:
                  errors.append(f"{rel}: choysum.entryPoints must be a non-empty object")
              else:
                  unknown_keys = sorted(set(entry_points.keys()) - optional_entry_keys)
                  if unknown_keys:
                      errors.append(f"{rel}: choysum.entryPoints has unsupported keys: {', '.join(unknown_keys)}")
                  if not any(key in entry_points for key in ("service", "web")):
                      errors.append(f"{rel}: choysum.entryPoints must include at least one of service/web")
                  for key, value in entry_points.items():
                      if not isinstance(value, str) or not value.strip():
                          errors.append(f"{rel}: choysum.entryPoints.{key} must be a non-empty string")

              publish_cfg = data.get("publishConfig")
              if not isinstance(publish_cfg, dict) or publish_cfg.get("access") != "public":
                  errors.append(f"{rel}: publishConfig.access must equal 'public'")

          if errors:
              print("preflight schema validation failed:", file=sys.stderr)
              for item in errors:
                  print(f"- {item}", file=sys.stderr)
              sys.exit(1)

          print("preflight schema validation passed")
          PY

  discover-module-updates:
    name: modules / discover-module-updates
    needs:
      - preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      modules_json: ${{ steps.discover.outputs.modules_json }}
      has_modules: ${{ steps.discover.outputs.has_modules }}
      artifact_name: ${{ steps.discover.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.run_ref }}
          fetch-depth: 0

      - name: Discover target modules
        id: discover
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          repo_root = pathlib.Path.cwd()
          modules_root = repo_root / "modules"

          target_module = "${{ inputs.target_module }}".strip()
          event_name = "${{ github.event_name }}"

          available_modules = sorted(
              child.name
              for child in modules_root.iterdir()
              if child.is_dir() and child.name not in {".choysum", "tmp"}
          )

          if target_module:
              if target_module not in available_modules:
                  raise SystemExit(f"target_module '{target_module}' does not exist under modules/")
              modules = [target_module]
          elif event_name == "push":
              before = "${{ github.event.before }}".strip()
              head = "${{ github.sha }}".strip()
              modules = []
              if before:
                  diff = subprocess.run(
                      ["git", "diff", "--name-only", f"{before}...{head}"],
                      check=True,
                      capture_output=True,
                      text=True,
                  )
                  changed = [line.strip() for line in diff.stdout.splitlines() if line.strip()]
                  seen = set()
                  for path in changed:
                      parts = path.split("/")
                      if len(parts) >= 3 and parts[0] == "modules" and parts[1] in available_modules:
                          if parts[1] not in seen:
                              modules.append(parts[1])
                              seen.add(parts[1])
              if not modules:
                  modules = available_modules
          else:
              modules = available_modules

          modules = sorted(dict.fromkeys(modules))
          has_modules = "true" if modules else "false"

          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as fh:
              print(f"modules_json={json.dumps(modules, separators=(',', ':'))}", file=fh)
              print(f"has_modules={has_modules}", file=fh)
              print("artifact_name=module-discovery", file=fh)

          artifact_dir = repo_root / ".choysum" / "tmp"
          artifact_dir.mkdir(parents=True, exist_ok=True)
          report = {
              "modules": modules,
              "event": event_name,
              "target_module": target_module,
              "run_ref": "${{ needs.preflight.outputs.run_ref }}",
          }
          (artifact_dir / "module-discovery.json").write_text(
              json.dumps(report, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload discovery artifact
        uses: actions/upload-artifact@v7
        with:
          name: module-discovery
          path: .choysum/tmp/module-discovery.json
          if-no-files-found: error
          retention-days: 7

  verify-module-gate:
    name: modules / verify-module-gate
    needs:
      - preflight
      - discover-module-updates
    if: ${{ needs.discover-module-updates.outputs.has_modules == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.run_ref }}

      - name: Verify module metadata consistency
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import pathlib
          import sys

          repo_root = pathlib.Path.cwd()
          modules_root = repo_root / "modules"
          modules = json.loads('${{ needs.discover-module-updates.outputs.modules_json }}')

          errors = []
          for module in modules:
              package_path = modules_root / module / "package.json"
              if not package_path.is_file():
                  errors.append(f"modules/{module}/package.json is missing")
                  continue

              data = json.loads(package_path.read_text(encoding="utf-8"))
              name = data.get("name")
              version = data.get("version")
              choysum = data.get("choysum") if isinstance(data, dict) else {}
              module_name = choysum.get("moduleName") if isinstance(choysum, dict) else None

              if not isinstance(name, str) or not name.startswith("@"):
                  errors.append(f"modules/{module}/package.json: name must be a scoped package")

                if not isinstance(version, str) or not version.strip():
                  errors.append(f"modules/{module}/package.json: version must be non-empty")

              if module_name != module:
                  errors.append(
                      f"modules/{module}/package.json: choysum.moduleName '{module_name}' must equal directory '{module}'"
                  )

          if errors:
              print("verify-module-gate failed:", file=sys.stderr)
              for item in errors:
                  print(f"- {item}", file=sys.stderr)
              sys.exit(1)

          print("verify-module-gate metadata checks passed")
          PY

  publish-npm-registry-shard:
    name: modules / publish-npm-registry (${{ matrix.module }})
    needs:
      - preflight
      - discover-module-updates
      - verify-module-gate
    if: ${{ needs.discover-module-updates.outputs.has_modules == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-module-updates.outputs.modules_json) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.run_ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Publish single module (idempotent)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          MODULE_NAME: ${{ matrix.module }}
          DRY_RUN: ${{ needs.preflight.outputs.dry_run }}
        run: |
          set -euo pipefail
          mkdir -p .choysum/tmp
          python3 <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          import pathlib
          import re
          import subprocess

          repo_root = pathlib.Path.cwd()
          modules_root = repo_root / "modules"
          output_dir = repo_root / ".choysum" / "tmp"
          module = os.environ["MODULE_NAME"].strip()
          dry_run = os.environ.get("DRY_RUN", "true").strip().lower() == "true"
          semver_pattern = re.compile(r"^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$")

          result_file = output_dir / f"publish-result-{module}.json"
          error_file = output_dir / f"publish-error-{module}.json"

          def compact(text: str, limit: int = 8000) -> str:
              value = (text or "").strip()
              if len(value) <= limit:
                  return value
              return value[-limit:]

          errors = []
          result = {
              "module": module,
              "status": "failed",
          }

          package_path = modules_root / module / "package.json"
          if not package_path.is_file():
              errors.append(
                  {
                      "module": module,
                      "operation": "load_package_json",
                      "error": "missing_package_json",
                  }
              )
          else:
              package_json = json.loads(package_path.read_text(encoding="utf-8"))
              name = package_json.get("name")
              version = package_json.get("version")
              choysum = package_json.get("choysum") if isinstance(package_json, dict) else {}
              module_name = choysum.get("moduleName") if isinstance(choysum, dict) else None

              result["name"] = name
              result["version"] = version

              if not isinstance(name, str) or not name.startswith("@"):
                  errors.append(
                      {
                          "module": module,
                          "operation": "publish_precheck",
                          "error": "invalid_package_name",
                          "message": "name must be a scoped package",
                      }
                  )

              if not isinstance(version, str) or not semver_pattern.match(version):
                  errors.append(
                      {
                          "module": module,
                          "operation": "publish_precheck",
                          "error": "invalid_package_version",
                          "message": "version must be valid semver",
                      }
                  )

              if module_name != module:
                  errors.append(
                      {
                          "module": module,
                          "operation": "publish_precheck",
                          "error": "module_name_mismatch",
                          "message": f"choysum.moduleName '{module_name}' must match directory '{module}'",
                      }
                  )

              if not errors:
                  pack = subprocess.run(
                      ["npm", "pack", "--dry-run", "--json"],
                      cwd=str(modules_root / module),
                      check=False,
                      capture_output=True,
                      text=True,
                  )
                  if pack.returncode != 0:
                      errors.append(
                          {
                              "module": module,
                              "operation": "npm_pack_dry_run",
                              "command": "npm pack --dry-run --json",
                              "exitCode": pack.returncode,
                              "stdout": compact(pack.stdout),
                              "stderr": compact(pack.stderr),
                          }
                      )

              if not errors:
                  identifier = f"{name}@{version}"
                  view = subprocess.run(
                      ["npm", "view", identifier, "version"],
                      check=False,
                      capture_output=True,
                      text=True,
                  )

                  if view.returncode == 0:
                      result["status"] = "already_published"
                  else:
                      view_text = f"{view.stdout}\n{view.stderr}".lower()
                      view_not_found = "e404" in view_text or "404" in view_text or "not found" in view_text
                      if not view_not_found:
                          errors.append(
                              {
                                  "module": module,
                                  "operation": "npm_view",
                                  "command": f"npm view {identifier} version",
                                  "exitCode": view.returncode,
                                  "stdout": compact(view.stdout),
                                  "stderr": compact(view.stderr),
                              }
                          )
                      elif dry_run:
                          result["status"] = "published"
                          result["dryRun"] = True
                          result["note"] = "would_publish"
                      else:
                          publish = subprocess.run(
                              ["npm", "publish", "--access", "public"],
                              cwd=str(modules_root / module),
                              check=False,
                              capture_output=True,
                              text=True,
                          )
                          if publish.returncode == 0:
                              result["status"] = "published"
                          else:
                              errors.append(
                                  {
                                      "module": module,
                                      "operation": "npm_publish",
                                      "command": "npm publish --access public",
                                      "exitCode": publish.returncode,
                                      "stdout": compact(publish.stdout),
                                      "stderr": compact(publish.stderr),
                                  }
                              )

          if errors:
              result["status"] = "failed"
              result["errorRef"] = f"publish-error-{module}.json"

          result_file.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          error_payload = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "module": module,
              "errors": errors,
          }
          error_file.write_text(json.dumps(error_payload, indent=2) + "\n", encoding="utf-8")

          if result.get("status") == "failed":
              raise SystemExit("module publish shard failed")
          PY

      - name: Upload shard publish artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: publish-shard-${{ matrix.module }}
          path: |
            .choysum/tmp/publish-result-${{ matrix.module }}.json
            .choysum/tmp/publish-error-${{ matrix.module }}.json
          if-no-files-found: error
          retention-days: 14

  publish-npm-registry:
    name: modules / publish-npm-registry
    needs:
      - preflight
      - discover-module-updates
      - verify-module-gate
      - publish-npm-registry-shard
    if: ${{ always() && needs.discover-module-updates.outputs.has_modules == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download shard publish artifacts
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: publish-shard-*
          merge-multiple: true
          path: .choysum/tmp/publish-results

      - name: Aggregate publish results
        id: aggregate
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p .choysum/tmp
          python3 <<'PY'
          from datetime import datetime, timezone
          import json
          import pathlib
          import sys

          output_dir = pathlib.Path('.choysum/tmp')
          shard_dir = output_dir / 'publish-results'
          expected_modules = json.loads('${{ needs.discover-module-updates.outputs.modules_json }}')

          results = []
          errors = []

          for module in expected_modules:
              result_path = shard_dir / f'publish-result-{module}.json'
              error_path = shard_dir / f'publish-error-{module}.json'

              if not result_path.is_file():
                  results.append(
                      {
                          "module": module,
                          "status": "failed",
                          "error": "missing_publish_result_artifact",
                          "errorRef": f"publish-error-{module}.json",
                      }
                  )
                  errors.append(
                      {
                          "module": module,
                          "operation": "aggregate_publish_results",
                          "error": "missing_publish_result_artifact",
                      }
                  )
                  continue

              result = json.loads(result_path.read_text(encoding='utf-8'))
              results.append(result)

              if error_path.is_file():
                  payload = json.loads(error_path.read_text(encoding='utf-8'))
                  for item in payload.get('errors', []):
                      errors.append(item)
              elif result.get('status') == 'failed':
                  errors.append(
                      {
                          "module": module,
                          "operation": "aggregate_publish_results",
                          "error": "missing_publish_error_artifact",
                      }
                  )

          results.sort(key=lambda item: item.get('module', ''))
          (output_dir / 'published-modules.json').write_text(json.dumps(results, indent=2) + '\n', encoding='utf-8')

          diagnostics = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "errors": errors,
          }
          (output_dir / 'publish-errors.json').write_text(json.dumps(diagnostics, indent=2) + '\n', encoding='utf-8')

          failed = [item for item in results if item.get('status') == 'failed']
          if failed:
              print('publish-npm-registry aggregate found failed module shards', file=sys.stderr)
              raise SystemExit('One or more module publish shards failed')
          PY

      - name: Upload published modules artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: published-modules
          path: .choysum/tmp/published-modules.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload publish diagnostics artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: publish-diagnostics
          path: .choysum/tmp/publish-errors.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce publish aggregate outcome
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.aggregate.outcome }}" != "success" ]]; then
            echo "publish-npm-registry aggregate failed" >&2
            exit 1
          fi

  sync-catalog-directory-pr:
    name: modules / sync-catalog-directory-pr
    needs:
      - preflight
      - publish-npm-registry
    if: ${{ always() && needs.publish-npm-registry.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download published modules artifact
        uses: actions/download-artifact@v8
        with:
          name: published-modules
          path: .choysum/tmp

      - name: Validate modules-directory API precheck
        id: sync_precheck
        continue-on-error: true
        env:
          MODULES_DIRECTORY_SYNC_TOKEN: ${{ secrets.MODULES_DIRECTORY_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          output_dir = pathlib.Path('.choysum/tmp')
          output_dir.mkdir(parents=True, exist_ok=True)

          token = os.environ.get('MODULES_DIRECTORY_SYNC_TOKEN', '').strip()
          errors = []
          summary = {
              "status": "precheck_passed",
              "note": "modules-directory precheck completed",
          }

          if not token:
              errors.append(
                  {
                      "operation": "sync_precheck",
                      "error": "missing_secret",
                      "message": "MODULES_DIRECTORY_SYNC_TOKEN is not configured",
                  }
              )
              summary = {
                  "status": "precheck_failed",
                  "note": "missing MODULES_DIRECTORY_SYNC_TOKEN",
              }
          else:
              request = urllib.request.Request(
                  'https://api.github.com/repos/choysum-dev/modules-directory',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      _ = response.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as exc:
                  errors.append(
                      {
                          "operation": "sync_precheck",
                          "error": "http_error",
                          "status": exc.code,
                          "response": exc.read().decode('utf-8', errors='replace'),
                      }
                  )
                  summary = {
                      "status": "precheck_failed",
                      "note": "modules-directory API returned non-2xx",
                  }
              except Exception as exc:
                  errors.append(
                      {
                          "operation": "sync_precheck",
                          "error": "request_exception",
                          "message": str(exc),
                      }
                  )
                  summary = {
                      "status": "precheck_failed",
                      "note": "modules-directory API request exception",
                  }

          sync_error_payload = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "errors": errors,
          }
          (output_dir / 'sync-errors.json').write_text(json.dumps(sync_error_payload, indent=2) + '\n', encoding='utf-8')
          (output_dir / 'sync-summary.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')

          if errors:
              raise SystemExit('sync-catalog-directory-pr precheck failed')
          PY

      - name: Stub catalog sync
        if: ${{ steps.sync_precheck.outcome == 'success' }}
        run: |
          set -euo pipefail
          cat > .choysum/tmp/sync-summary.json <<'JSON'
          {
            "status": "stubbed",
            "note": "sync-catalog-directory-pr implementation is pending and will consume published-modules.json"
          }
          JSON
          echo "sync-catalog-directory-pr is not implemented yet."
          echo "It will consume .choysum/tmp/published-modules.json in 11.5.3 implementation."

      - name: Upload sync diagnostics artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: sync-diagnostics
          path: |
            .choysum/tmp/sync-errors.json
            .choysum/tmp/sync-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce sync precheck outcome
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.sync_precheck.outcome }}" != "success" ]]; then
            echo "sync-catalog-directory-pr precheck failed" >&2
            exit 1
          fi

  finalize-publish:
    name: modules / finalize-publish
    needs:
      - preflight
      - discover-module-updates
      - verify-module-gate
      - publish-npm-registry-shard
      - publish-npm-registry
      - sync-catalog-directory-pr
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Summarize module publish pipeline status
        run: |
          set -euo pipefail
          echo "preflight=${{ needs.preflight.result }}"
          echo "discover-module-updates=${{ needs.discover-module-updates.result }}"
          echo "verify-module-gate=${{ needs.verify-module-gate.result }}"
          echo "publish-npm-registry-shard=${{ needs.publish-npm-registry-shard.result }}"
          echo "publish-npm-registry=${{ needs.publish-npm-registry.result }}"
          echo "sync-catalog-directory-pr=${{ needs.sync-catalog-directory-pr.result }}"

      - name: Write stage result report
        run: |
          set -euo pipefail
          mkdir -p .choysum/tmp
          cat > .choysum/tmp/pipeline-stage-results.json <<JSON
          {
            "preflight": "${{ needs.preflight.result }}",
            "discover-module-updates": "${{ needs.discover-module-updates.result }}",
            "verify-module-gate": "${{ needs.verify-module-gate.result }}",
            "publish-npm-registry-shard": "${{ needs.publish-npm-registry-shard.result }}",
            "publish-npm-registry": "${{ needs.publish-npm-registry.result }}",
            "sync-catalog-directory-pr": "${{ needs.sync-catalog-directory-pr.result }}"
          }
          JSON

      - name: Upload pipeline stage report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-stage-results
          path: .choysum/tmp/pipeline-stage-results.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce fail-fast outcome
        run: |
          set -euo pipefail
          for job in \
            "${{ needs.preflight.result }}" \
            "${{ needs.discover-module-updates.result }}" \
            "${{ needs.verify-module-gate.result }}" \
            "${{ needs.publish-npm-registry-shard.result }}" \
            "${{ needs.publish-npm-registry.result }}" \
            "${{ needs.sync-catalog-directory-pr.result }}"
          do
            if [[ "$job" != "success" && "$job" != "skipped" ]]; then
              echo "module publish pipeline failed due to upstream job result: $job" >&2
              exit 1
            fi
          done
