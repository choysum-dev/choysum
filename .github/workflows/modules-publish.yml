name: Modules Publish

on:
  workflow_dispatch:
    inputs:
      target_module:
        description: "Single module name to target (empty means all publishable modules)"
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
    paths:
      - "modules/**"
      - ".github/workflows/modules-publish.yml"

permissions:
  contents: read

concurrency:
  group: modules-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: modules / preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate module metadata schema baseline
        run: |
          set -euo pipefail
          python3 scripts/ci/modules_publish_preflight.py validate-schema-baseline

      - name: Warn if legacy NPM_PUBLISH_TOKEN is still present
        env:
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${NPM_PUBLISH_TOKEN:-}" ]]; then
            echo "::warning::NPM_PUBLISH_TOKEN is still configured but unused; remove after OIDC canary (Phase 2)."
          fi

  discover-module-updates:
    name: modules / discover-module-updates
    needs:
      - preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      modules_json: ${{ steps.discover.outputs.modules_json }}
      has_modules: ${{ steps.discover.outputs.has_modules }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Discover target modules
        id: discover
        env:
          TARGET_MODULE: ${{ inputs.target_module }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          python3 scripts/ci/modules_publish_preflight.py discover-target-modules

      - name: Upload discovery artifact
        uses: actions/upload-artifact@v7
        with:
          name: module-discovery
          path: .choysum/tmp/module-discovery.json
          if-no-files-found: error
          retention-days: 7

  verify-module-gate:
    name: modules / verify-module-gate
    needs:
      - preflight
      - discover-module-updates
    if: ${{ needs.discover-module-updates.outputs.has_modules == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify module metadata consistency
        env:
          MODULES_JSON: ${{ needs.discover-module-updates.outputs.modules_json }}
        run: |
          set -euo pipefail
          python3 scripts/ci/modules_publish.py verify-gate

  validate-modules:
    name: modules / validate-modules
    needs:
      - preflight
      - discover-module-updates
      - verify-module-gate
    if: ${{ needs.discover-module-updates.outputs.has_modules == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Ensure modern npm CLI
        run: npm install -g npm@latest

      - name: Validate modules (pack / view; no publish)
        env:
          MODULES_JSON: ${{ needs.discover-module-updates.outputs.modules_json }}
          PUBLISH_MODE: validate
        run: |
          set -euo pipefail
          mkdir -p .choysum/tmp
          python3 scripts/ci/modules_publish.py process-modules

      - name: Upload validate diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: validate-modules
          path: |
            .choysum/tmp/published-modules.json
            .choysum/tmp/publish-errors.json
          if-no-files-found: error
          retention-days: 14

  publish-modules:
    name: modules / publish-modules
    needs:
      - preflight
      - discover-module-updates
      - verify-module-gate
      - validate-modules
    if: ${{ github.event_name == 'workflow_dispatch' && needs.discover-module-updates.outputs.has_modules == 'true' && needs.validate-modules.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Ensure modern npm CLI
        run: npm install -g npm@latest

      - name: Publish modules via OIDC (serial)
        env:
          MODULES_JSON: ${{ needs.discover-module-updates.outputs.modules_json }}
          PUBLISH_MODE: release
          # Intentionally no NODE_AUTH_TOKEN / NPM_PUBLISH_TOKEN — OIDC only.
        run: |
          set -euo pipefail
          mkdir -p .choysum/tmp
          python3 scripts/ci/modules_publish.py process-modules

      - name: Upload published modules artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: published-modules
          path: .choysum/tmp/published-modules.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload publish diagnostics artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: publish-diagnostics
          path: .choysum/tmp/publish-errors.json
          if-no-files-found: error
          retention-days: 14

  sync-catalog-directory-pr:
    name: modules / sync-catalog-directory-pr
    needs:
      - publish-modules
    if: ${{ always() && needs.publish-modules.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download published modules artifact
        uses: actions/download-artifact@v8
        with:
          name: published-modules
          path: .choysum/tmp

      - name: Validate modules-directory API precheck
        id: sync_precheck
        continue-on-error: true
        env:
          MODULES_DIRECTORY_SYNC_TOKEN: ${{ secrets.MODULES_DIRECTORY_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/ci/modules_publish.py sync-precheck

      - name: Sync modules-directory pointers (per-module PR)
        id: sync_modules
        if: ${{ steps.sync_precheck.outcome == 'success' }}
        continue-on-error: true
        env:
          MODULES_DIRECTORY_SYNC_TOKEN: ${{ secrets.MODULES_DIRECTORY_SYNC_TOKEN }}
          PUBLISH_MODE: release
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_RUN_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/modules_publish.py sync-modules-per-module-pr

      - name: Upload sync diagnostics artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: sync-diagnostics
          path: |
            .choysum/tmp/sync-errors.json
            .choysum/tmp/sync-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce sync outcomes
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.sync_precheck.outcome }}" != "success" ]]; then
            echo "sync-catalog-directory-pr precheck failed" >&2
            exit 1
          fi
          if [[ "${{ steps.sync_modules.outcome }}" != "success" ]]; then
            echo "sync-catalog-directory-pr module sync failed" >&2
            exit 1
          fi

  finalize-publish:
    name: modules / finalize-publish
    needs:
      - preflight
      - discover-module-updates
      - verify-module-gate
      - validate-modules
      - publish-modules
      - sync-catalog-directory-pr
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Summarize module publish pipeline status
        run: |
          set -euo pipefail
          echo "preflight=${{ needs.preflight.result }}"
          echo "discover-module-updates=${{ needs.discover-module-updates.result }}"
          echo "verify-module-gate=${{ needs.verify-module-gate.result }}"
          echo "validate-modules=${{ needs.validate-modules.result }}"
          echo "publish-modules=${{ needs.publish-modules.result }}"
          echo "sync-catalog-directory-pr=${{ needs.sync-catalog-directory-pr.result }}"

      - name: Write stage result report
        run: |
          set -euo pipefail
          mkdir -p .choysum/tmp
          cat > .choysum/tmp/pipeline-stage-results.json <<JSON
          {
            "preflight": "${{ needs.preflight.result }}",
            "discover-module-updates": "${{ needs.discover-module-updates.result }}",
            "verify-module-gate": "${{ needs.verify-module-gate.result }}",
            "validate-modules": "${{ needs.validate-modules.result }}",
            "publish-modules": "${{ needs.publish-modules.result }}",
            "sync-catalog-directory-pr": "${{ needs.sync-catalog-directory-pr.result }}"
          }
          JSON

      - name: Upload pipeline stage report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-stage-results
          path: .choysum/tmp/pipeline-stage-results.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce fail-fast outcome
        run: |
          set -euo pipefail
          for job in \
            "${{ needs.preflight.result }}" \
            "${{ needs.discover-module-updates.result }}" \
            "${{ needs.verify-module-gate.result }}" \
            "${{ needs.validate-modules.result }}" \
            "${{ needs.publish-modules.result }}" \
            "${{ needs.sync-catalog-directory-pr.result }}"
          do
            if [[ "$job" != "success" && "$job" != "skipped" ]]; then
              echo "module publish pipeline failed due to upstream job result: $job" >&2
              exit 1
            fi
          done
