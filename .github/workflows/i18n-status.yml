#
# Optional terminology catalog gate (S6).
# Disable or skip this workflow to leave runtime unaffected.

name: I18n Status

on:
  pull_request:
    paths:
      - "modules/**/i18n/**"
      - "modules/**/*.{ts,tsx,vue}"
      - "internal/i18n/**"
      - "cmd/cmd_i18n.go"
      - "scripts/ci/i18n_status.sh"
      - ".github/workflows/i18n-status.yml"
  workflow_dispatch:
    inputs:
      skip_pot_check:
        description: Skip extract pot-drift check (faster)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: i18n-status-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare-embedded-assets:
    name: i18n / prepare-embedded-assets
    uses: ./.github/workflows/prepare-embedded-assets.yml
    with:
      run_ref: ${{ github.ref }}
      artifact_name: i18n-embedded-assets
      archive_path: .choysum/tmp/i18n-embedded-assets.tar.gz
      retention_days: 1

  status:
    name: i18n / status
    needs:
      - prepare-embedded-assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download and extract embedded assets
        uses: ./.github/actions/download-extract-embedded-assets
        with:
          artifact-name: i18n-embedded-assets
          archive-path: .choysum/tmp/i18n-embedded-assets.tar.gz

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Terminology status gate
        env:
          I18N_STATUS_LANG: zh_CN
          I18N_STATUS_SKIP_POT: ${{ inputs.skip_pot_check && '1' || '0' }}
        run: bash scripts/ci/i18n_status.sh
