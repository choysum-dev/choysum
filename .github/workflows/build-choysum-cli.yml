name: Build Choysum CLI

on:
  workflow_call:
    inputs:
      embedded_assets_artifact_name:
        description: "Embedded assets artifact name to download"
        required: true
        type: string
      embedded_assets_archive_path:
        description: "Path to embedded assets archive to extract"
        required: true
        type: string
      choysum_artifact_name:
        description: "Artifact name for built choysum CLI"
        required: true
        type: string
      choysum_binary_path:
        description: "Output path for built choysum CLI binary"
        required: true
        type: string
      retention_days:
        description: "Artifact retention days"
        required: true
        type: number

permissions:
  contents: read

jobs:
  build-choysum-cli:
    name: build-choysum-cli
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download and extract embedded assets
        uses: ./.github/actions/download-extract-embedded-assets
        with:
          artifact-name: ${{ inputs.embedded_assets_artifact_name }}
          archive-path: ${{ inputs.embedded_assets_archive_path }}

      - name: Compute embedded assets hash for CLI cache key
        id: embed-key
        run: |
          set -euo pipefail
          embed_hash="$(
            {
              find internal/bootstrap/web/dist pkg/jsengine/scripts/vuesfc/dist -type f -print0 \
                | sort -z \
                | xargs -0 sha256sum
            } | sha256sum | awk '{print $1}'
          )"
          echo "embed_hash=$embed_hash" >> "$GITHUB_OUTPUT"
          echo "Embedded assets hash: $embed_hash"
          mkdir -p "$(dirname "${{ inputs.choysum_binary_path }}")"

      # Exact-key only — never restore-keys (wrong binary would silently ship).
      - name: Restore choysum CLI cache
        id: cli-cache
        uses: actions/cache@v6
        with:
          path: ${{ inputs.choysum_binary_path }}
          key: ${{ runner.os }}-choysum-cli-v1-${{ hashFiles('go.mod', 'go.sum', 'main.go', 'cmd/**/*.go', 'internal/**/*.go', 'pkg/**/*.go') }}-${{ steps.embed-key.outputs.embed_hash }}

      - name: Setup Go
        if: ${{ steps.cli-cache.outputs.cache-hit != 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build choysum CLI
        if: ${{ steps.cli-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          CHOYSUM_BINARY_PATH="${{ inputs.choysum_binary_path }}"
          mkdir -p "$(dirname "$CHOYSUM_BINARY_PATH")"
          go build -o "$CHOYSUM_BINARY_PATH" .

      - name: Upload choysum CLI
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.choysum_artifact_name }}
          path: ${{ inputs.choysum_binary_path }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
