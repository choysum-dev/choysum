name: Build Choysum CLI

on:
  workflow_call:
    inputs:
      embedded_assets_artifact_name:
        description: "Embedded assets artifact name to download"
        required: true
        type: string
      embedded_assets_archive_path:
        description: "Path to embedded assets archive to extract"
        required: true
        type: string
      choysum_artifact_name:
        description: "Artifact name for built choysum CLI"
        required: true
        type: string
      choysum_binary_path:
        description: "Output path for built choysum CLI binary"
        required: true
        type: string
      retention_days:
        description: "Artifact retention days"
        required: true
        type: number
      warm_typecheck_types:
        description: "After building CLI, warm type-fetch cache and upload modules/tsconfig.json"
        required: false
        default: "false"
        type: string
      modules_tsconfig_artifact_name:
        description: "Artifact name for modules/tsconfig.json when warm_typecheck_types is true"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build-choysum-cli:
    name: build-choysum-cli
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download and extract embedded assets
        uses: ./.github/actions/download-extract-embedded-assets
        with:
          artifact-name: ${{ inputs.embedded_assets_artifact_name }}
          archive-path: ${{ inputs.embedded_assets_archive_path }}

      - name: Compute embedded assets hash for CLI cache key
        id: embed-key
        run: |
          set -euo pipefail
          embed_hash="$(
            {
              find internal/bootstrap/web/dist pkg/jsengine/scripts/vuesfc/dist pkg/jsengine/scripts/vuevirtual/dist -type f -print0 \
                | sort -z \
                | xargs -0 sha256sum
            } | sha256sum | awk '{print $1}'
          )"
          echo "embed_hash=$embed_hash" >> "$GITHUB_OUTPUT"
          echo "Embedded assets hash: $embed_hash"
          mkdir -p "$(dirname "${{ inputs.choysum_binary_path }}")"

      # Exact-key only — never restore-keys (wrong binary would silently ship).
      # Include go:embed non-Go sources (ambient .d.ts, helpers, jsengine scripts,
      # codegen templates). Hashing only *.go misses those and ships a stale CLI.
      - name: Restore choysum CLI cache
        id: cli-cache
        uses: actions/cache@v6
        with:
          path: ${{ inputs.choysum_binary_path }}
          key: ${{ runner.os }}-choysum-cli-v2-${{ hashFiles('go.mod', 'go.sum', 'main.go', 'cmd/**', 'internal/**', 'pkg/**') }}-${{ steps.embed-key.outputs.embed_hash }}

      - name: Setup Go
        if: ${{ steps.cli-cache.outputs.cache-hit != 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build choysum CLI
        if: ${{ steps.cli-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          CHOYSUM_BINARY_PATH="${{ inputs.choysum_binary_path }}"
          mkdir -p "$(dirname "$CHOYSUM_BINARY_PATH")"
          go build -o "$CHOYSUM_BINARY_PATH" .

      - name: Upload choysum CLI
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.choysum_artifact_name }}
          path: ${{ inputs.choysum_binary_path }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      # Type-fetch warm is optional: unit/e2e only need the CLI binary. Callers that
      # also run typecheck should set warm_typecheck_types=true (and a tsconfig
      # artifact name). Warm stays in this job so typecheck avoids a second VM,
      # at the cost of unit/e2e waiting on type-fetch when warm is enabled.
      - name: Validate warm typecheck inputs
        if: ${{ inputs.warm_typecheck_types == 'true' && inputs.modules_tsconfig_artifact_name == '' }}
        run: |
          echo "error: modules_tsconfig_artifact_name is required when warm_typecheck_types is true" >&2
          exit 1

      - name: Make choysum CLI executable
        if: ${{ inputs.warm_typecheck_types == 'true' }}
        run: chmod +x "${{ inputs.choysum_binary_path }}"

      - name: Setup CLI testing pkg cache
        if: ${{ inputs.warm_typecheck_types == 'true' }}
        uses: ./.github/actions/setup-cli-testing-cache

      - name: Warm type-fetch assets into CLI pkg cache
        id: warm_types
        if: ${{ inputs.warm_typecheck_types == 'true' }}
        continue-on-error: true
        env:
          CHOYSUM_BIN: ${{ github.workspace }}/${{ inputs.choysum_binary_path }}
        # Bound warm so an esm.sh stall cannot hold the whole CLI job (and unit/e2e).
        # continue-on-error: CLI artifact is already uploaded; unit/e2e must not be skipped
        # when only typewarm fails (typecheck will fail later if tsconfig is missing).
        run: |
          set -euo pipefail
          if ! timeout --signal=TERM --kill-after=30s 30m bash scripts/ci/warm_typecheck_types.sh; then
            echo "::error title=typefetch warm::warm_typecheck_types.sh failed; typecheck shards will fail without the modules tsconfig artifact" >&2
            exit 1
          fi

      # modules/tsconfig.json is gitignored; type-fetch writes path maps here.
      # Shards restore the pkg cache but need these maps (no root node_modules).
      - name: Upload modules tsconfig path maps
        if: ${{ inputs.warm_typecheck_types == 'true' && steps.warm_types.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.modules_tsconfig_artifact_name }}
          path: modules/tsconfig.json
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
