name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  pull-requests: write
  issues: write
  contents: write
  statuses: write

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    name: Run PR Agent
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK.KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # DeepSeek V4 via litellm (see https://docs.pr-agent.ai/usage-guide/changing_a_model/)
          config.model: "deepseek/deepseek-v4-pro"
          config.fallback_models: '["deepseek/deepseek-v4-flash"]'
          # Required for models not yet listed in PR-Agent's built-in MAX_TOKENS table
          config.custom_model_max_tokens: "1000000"
          config.max_model_tokens: "1000000"
          # Optional: Enable automatic review, describe, and improve on PR events
          # Project-specific review/describe/improve instructions live in .pr_agent.toml
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
