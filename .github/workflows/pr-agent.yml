name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited]

# GLM-4.7-Flash free tier allows one in-flight request. Queue other PR-Agent
# runs instead of overlapping (429) or cancelling in-progress reviews.
concurrency:
  group: pr-agent
  cancel-in-progress: false

permissions:
  pull-requests: write
  issues: write
  contents: write
  statuses: write

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    name: Run PR Agent
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@v0.46.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Zhipu GLM-4.7-Flash last-resort fallback (free tokens, 1 concurrent).
          # Create a key at https://open.bigmodel.cn ; store as repo secret ZHIPUAI_API_KEY.
          # PR-Agent v0.46 LiteLLM does not register the `zhipuai/` provider, so call
          # the OpenAI-compatible BigModel endpoint as openai/glm-4.7-flash.
          OPENAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
          OPENAI_API_BASE: https://open.bigmodel.cn/api/paas/v4
          OPENAI_BASE_URL: https://open.bigmodel.cn/api/paas/v4
          # Free Gemini first; GLM-4.7-Flash if Gemini is unavailable.
          config.model: "gemini/gemini-3.8-flash"
          config.fallback_models: '["gemini/gemini-3.7-flash", "openai/glm-4.7-flash"]'
          # Cap the *input* budget used for /improve chunking. Setting this near 1M
          # made PR-Agent put multi-thousand-line PRs in a single chunk; models then
          # hit finish_reason=length (empty suggestions) or Gemini 503 under load.
          # Models not yet in PR-Agent's MAX_TOKENS table still need custom_model_*.
          config.custom_model_max_tokens: "100000"
          config.max_model_tokens: "100000"
          config.ai_timeout: "180"
          # LiteLLM retries 429 with exponential backoff (GLM free tier RPM / 1 concurrent).
          NUM_RETRIES: "6"
          # Workflow env applies before .pr_agent.toml is on the default branch.
          pr_code_suggestions.parallel_calls: "false"
          pr_code_suggestions.max_number_of_calls: "3"
          # Note: config.reasoning_effort is intentionally unset. PR-Agent v0.45.0 only
          # forwards it for allowlisted ids (e.g. gemini-2.5-flash/pro), not for
          # gemini-3.8-flash / glm-4.7-flash — so it would be a no-op here.
          # Auto review/describe/improve on open/reopen/ready_for_review.
          # Project-specific instructions live in .pr_agent.toml
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          # Default pr_actions omit synchronize; keep open-time tools on these events only.
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "review_requested"]'
          # On each push to an open PR (workflow already listens to synchronize), run /improve.
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/improve"]'
