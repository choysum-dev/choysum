name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  pull-requests: write
  issues: write
  contents: write
  statuses: write

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    name: Run PR Agent
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Specify the Gemini model to replace the default OpenAI configuration
          config.model: "gemini/gemini-3.6-flash"
          config.fallback_models: '["gemini/gemini-3.5-flash"]'
          # Required for models not yet listed in PR-Agent's built-in MAX_TOKENS table
          config.custom_model_max_tokens: "1000000"
          # Increase token limit to properly process large diffs
          config.max_model_tokens: "1000000"
          # Optional: Enable automatic review, describe, and improve on PR events
          # Project-specific review/describe/improve instructions live in .pr_agent.toml
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
