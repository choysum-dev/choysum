name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited]

# Queue PR-Agent runs instead of overlapping (shared Gemini / DeepSeek keys)
# or cancelling in-progress reviews mid-flight.
concurrency:
  group: pr-agent
  cancel-in-progress: false

permissions:
  pull-requests: write
  issues: write
  contents: write
  statuses: write

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    name: Run PR Agent
    # Bound wall time: ai_timeout × model hops must not hold the shared
    # concurrency group indefinitely when a provider is slow or rate-limited.
    timeout-minutes: 40
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@v0.47.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # DeepSeek fallback when Gemini is unavailable.
          # Create at https://platform.deepseek.com/api_keys ; store as repo secret DEEPSEEK_API_KEY
          # Model id: deepseek-flash (https://api-docs.deepseek.com/zh-cn/).
          DEEPSEEK.KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          config.model: "gemini/gemini-3.8-flash"
          config.fallback_models: '["deepseek/deepseek-flash"]'
          # Cap the *input* budget used for /improve chunking. Setting this near 1M
          # made PR-Agent put multi-thousand-line PRs in a single chunk; models then
          # hit finish_reason=length (empty suggestions) or Gemini 503 under load.
          # Models not yet in PR-Agent's MAX_TOKENS table still need custom_model_*.
          config.custom_model_max_tokens: "100000"
          config.max_model_tokens: "100000"
          # PR-Agent has one global reasoning_effort (no per-fallback override).
          # DeepSeek flash defaults to thinking; medium maps to high and CoT can
          # exhaust max_tokens with empty content (finish_reason=length). none
          # disables thinking for structured /improve JSON. Same value is sent to
          # the Gemini primary — accepted tradeoff; DeepSeek-only scoping is not
          # supported. https://api-docs.deepseek.com/zh-cn/guides/thinking_mode
          config.reasoning_effort: "none"
          # DeepSeek fallback often needs longer than Gemini free-tier calls.
          config.ai_timeout: "300"
          # On timeout, hand off to fallback_models instead of replaying the same
          # primary for NUM_RETRIES × ai_timeout on the sole concurrency slot.
          config.retry_same_model_on_timeout: "false"
          # LiteLLM retries 429 with exponential backoff.
          NUM_RETRIES: "6"
          # Workflow env applies before .pr_agent.toml is on the default branch.
          pr_code_suggestions.parallel_calls: "false"
          pr_code_suggestions.max_number_of_calls: "3"
          # Auto review/describe/improve on open/reopen/ready_for_review.
          # Project-specific instructions live in .pr_agent.toml
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          # Default pr_actions omit synchronize; keep open-time tools on these events only.
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "review_requested"]'
          # On each push to an open PR (workflow already listens to synchronize), run /improve.
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/improve"]'
