name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  pull-requests: write
  issues: write
  contents: write
  statuses: write

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    name: Run PR Agent
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@v0.43.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Specify the Gemini model to replace the default OpenAI configuration
          config.model: "gemini/gemini-3.8-flash"
          config.fallback_models: '["gemini/gemini-3.7-flash"]'
          # Required for models not yet listed in PR-Agent's built-in MAX_TOKENS table
          config.custom_model_max_tokens: "1000000"
          # Increase token limit to properly process large diffs
          config.max_model_tokens: "1000000"
          # Auto review/describe/improve on open/reopen/ready_for_review.
          # Project-specific instructions live in .pr_agent.toml
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          # Default pr_actions omit synchronize; keep open-time tools on these events only.
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "review_requested"]'
          # On each push to an open PR (workflow already listens to synchronize), run /improve.
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/improve"]'
