name: Prepare Embedded Assets

on:
  workflow_call:
    inputs:
      run_ref:
        description: "Branch, tag, or SHA to checkout"
        required: true
        type: string
      artifact_name:
        description: "Artifact name to upload"
        required: true
        type: string
      archive_path:
        description: "Archive path to create and upload"
        required: true
        type: string
      retention_days:
        description: "Artifact retention days"
        required: true
        type: number
      docs_only:
        description: "Skip asset build when docs-only routing is active"
        required: false
        default: "false"
        type: string

permissions:
  contents: read

jobs:
  prepare-embedded-assets:
    name: prepare-embedded-assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip embedded assets when docs-only routing is active
        if: ${{ inputs.docs_only == 'true' }}
        run: echo "embedded assets skipped by routing"

      - name: Checkout
        if: ${{ inputs.docs_only != 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.run_ref }}
          persist-credentials: false

      # Skip go generate when bootstrap/vuesfc sources (+ generator Go deps) are unchanged.
      - name: Restore embedded assets cache
        id: embedded-cache
        if: ${{ inputs.docs_only != 'true' }}
        uses: actions/cache@v6
        with:
          path: |
            internal/bootstrap/web/dist
            pkg/jsengine/scripts/vuesfc/dist
          key: ${{ runner.os }}-embedded-v2-${{ hashFiles('go.mod', 'go.sum', 'internal/bootstrap/web/generate.go', 'internal/bootstrap/web/gen.go', 'internal/bootstrap/web/package.json', 'internal/bootstrap/web/tsconfig.json', 'internal/bootstrap/web/index.html', 'internal/bootstrap/web/src/**', 'pkg/jsengine/scripts/vuesfc/**/*.go', 'pkg/jsengine/scripts/vuesfc/package.json', 'pkg/jsengine/scripts/vuesfc/tsconfig.json', 'pkg/jsengine/scripts/vuesfc/src/**', 'internal/esmresolver/**/*.go', 'internal/vueplugin/**/*.go', 'internal/defaultengine/**/*.go', 'internal/defaultjsexecutor/**/*.go', 'internal/module/artifact/generate/grpcwebplugin/gots/**/*.go', 'pkg/config/**/*.go', 'pkg/jsexecutor/**/*.go', 'pkg/scope/**/*.go') }}

      # Generators honor CHOYSUM_HOME as the cache root (else ~/.choysum). Align with
      # the workspace path we restore/save below so ESM hits are effective.
      - name: Cache esm packages for go generate
        if: ${{ inputs.docs_only != 'true' && steps.embedded-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache@v6
        with:
          path: .choysum/pkg/esm
          key: ${{ runner.os }}-esm-generate-v1-${{ hashFiles('go.mod', 'go.sum', 'internal/bootstrap/web/package.json', 'pkg/jsengine/scripts/vuesfc/package.json') }}
          restore-keys: |
            ${{ runner.os }}-esm-generate-v1-

      - name: Setup Go
        if: ${{ inputs.docs_only != 'true' && steps.embedded-cache.outputs.cache-hit != 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Vue SFC embed asset (go generate)
        if: ${{ inputs.docs_only != 'true' && steps.embedded-cache.outputs.cache-hit != 'true' }}
        env:
          CHOYSUM_HOME: ${{ github.workspace }}/.choysum
        run: go generate ./pkg/jsengine/scripts/vuesfc/...

      - name: Generate bootstrap web assets (go generate)
        if: ${{ inputs.docs_only != 'true' && steps.embedded-cache.outputs.cache-hit != 'true' }}
        env:
          CHOYSUM_HOME: ${{ github.workspace }}/.choysum
        run: go generate ./internal/bootstrap/web/...

      - name: Pack embedded assets
        if: ${{ inputs.docs_only != 'true' }}
        run: |
          ARCHIVE_PATH="${{ inputs.archive_path }}"
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          tar -czf "$ARCHIVE_PATH" \
            internal/bootstrap/web/dist \
            pkg/jsengine/scripts/vuesfc/dist/index.js

      - name: Upload embedded assets
        if: ${{ inputs.docs_only != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.archive_path }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
