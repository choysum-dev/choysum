name: Prepare Embedded Assets

on:
  workflow_call:
    inputs:
      run_ref:
        description: "Branch, tag, or SHA to checkout"
        required: true
        type: string
      artifact_name:
        description: "Artifact name to upload"
        required: true
        type: string
      archive_path:
        description: "Archive path to create and upload"
        required: true
        type: string
      retention_days:
        description: "Artifact retention days"
        required: true
        type: number
      docs_only:
        description: "Skip asset build when docs-only routing is active"
        required: false
        default: "false"
        type: string

permissions:
  contents: read

jobs:
  prepare-embedded-assets:
    name: prepare-embedded-assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip embedded assets when docs-only routing is active
        if: ${{ inputs.docs_only == 'true' }}
        run: echo "embedded assets skipped by routing"

      - name: Checkout
        if: ${{ inputs.docs_only != 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.run_ref }}

      - name: Setup Go
        if: ${{ inputs.docs_only != 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Vue SFC embed asset (go generate)
        if: ${{ inputs.docs_only != 'true' }}
        run: go generate ./pkg/jsengine/scripts/vuesfc/...

      - name: Generate bootstrap web assets (go generate)
        if: ${{ inputs.docs_only != 'true' }}
        run: go generate ./internal/bootstrap/web/...

      - name: Pack embedded assets
        if: ${{ inputs.docs_only != 'true' }}
        run: |
          ARCHIVE_PATH="${{ inputs.archive_path }}"
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          tar -czf "$ARCHIVE_PATH" \
            internal/bootstrap/web/dist \
            pkg/jsengine/scripts/vuesfc/dist/index.js

      - name: Upload embedded assets
        if: ${{ inputs.docs_only != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.archive_path }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
