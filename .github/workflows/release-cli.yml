name: Release CLI

on:
  push:
    tags:
      - 'v*' # Trigger release only when pushing tags starting with 'v' (e.g., v1.5.0)

permissions:
  contents: write # Write permission is required to create a GitHub release

jobs:
  prepare-embedded-assets:
    name: Prepare Embedded Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            internal/bootstrap/web/package-lock.json
            pkg/jsengine/scripts/vuesfc/package-lock.json

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Vue SFC npm dependencies
        working-directory: pkg/jsengine/scripts/vuesfc
        run: npm ci

      - name: Build Vue SFC embed asset
        working-directory: pkg/jsengine/scripts/vuesfc
        run: npm run build

      - name: Install bootstrap npm dependencies
        working-directory: internal/bootstrap/web
        run: npm ci

      - name: Build bootstrap dist
        working-directory: internal/bootstrap/web
        run: npm run build

      - name: Pack embedded assets
        run: |
          mkdir -p .choysum/tmp
          tar -czf .choysum/tmp/release-embedded-assets.tar.gz \
            internal/bootstrap/web/dist \
            pkg/jsengine/scripts/vuesfc/dist/index.js

      - name: Upload embedded assets
        uses: actions/upload-artifact@v4
        with:
          name: release-embedded-assets
          path: .choysum/tmp/release-embedded-assets.tar.gz
          if-no-files-found: error
          retention-days: 1

  build:
    needs: prepare-embedded-assets
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # linux_amd64
          - os: ubuntu-latest
            target: linux_amd64
          # linux_arm64
          - os: ubuntu-24.04-arm
            target: linux_arm64
          # darwin_arm64
          - os: macos-26
            target: darwin_arm64
          # darwin_amd64
          - os: macos-26-intel
            target: darwin_amd64
          # windows_amd64
          - os: windows-latest
            target: windows_amd64
          # windows_arm64
          - os: windows-11-arm
            target: windows_arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download embedded assets
        uses: actions/download-artifact@v4
        with:
          name: release-embedded-assets
          path: ${{ runner.temp }}/release-embedded-assets

      - name: Extract embedded assets
        shell: bash
        run: |
          ARCHIVE_PATH="${{ runner.temp }}/release-embedded-assets/release-embedded-assets.tar.gz"
          WORKSPACE_PATH="$GITHUB_WORKSPACE"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ARCHIVE_PATH="$(cygpath -u "$ARCHIVE_PATH")"
            WORKSPACE_PATH="$(cygpath -u "$WORKSPACE_PATH")"
          fi
          tar -xzf "$ARCHIVE_PATH" -C "$WORKSPACE_PATH"

      - name: Configure CGO compiler for windows_arm64
        if: ${{ matrix.target == 'windows_arm64' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x "/c/msys64/clangarm64/bin/clang.exe" ]] && [[ -x "/c/msys64/clangarm64/bin/clang++.exe" ]]; then
            echo "C:\\msys64\\clangarm64\\bin" >> "$GITHUB_PATH"
            echo "CC=C:\\msys64\\clangarm64\\bin\\clang.exe" >> "$GITHUB_ENV"
            echo "CXX=C:\\msys64\\clangarm64\\bin\\clang++.exe" >> "$GITHUB_ENV"
            echo "Using clang from C:\\msys64\\clangarm64\\bin"
            CLANG_VERSION="$(/c/msys64/clangarm64/bin/clang.exe --version | tr -d '\r')"
            echo "$CLANG_VERSION"
            if printf '%s\n' "$CLANG_VERSION" | grep -Eiq '^Target: .*windows-msvc'; then
              echo "Unexpected MSVC clang target for windows_arm64; require MSYS2 clangarm64 GNU target" >&2
              exit 1
            fi
          else
            echo "MSYS2 clangarm64 toolchain not found at C:\\msys64\\clangarm64\\bin" >&2
            exit 1
          fi

      - name: Print CGO compiler env
        if: ${{ matrix.target == 'windows_arm64' }}
        shell: bash
        run: |
          echo "CC=$CC"
          echo "CXX=$CXX"
          go env CC CXX GOOS GOARCH

      - name: Prepare GoReleaser config for current target
        id: prepare_goreleaser_config
        shell: bash
        run: |
          TARGET_CONFIG_PATH="$RUNNER_TEMP/goreleaser.target.yaml"
          awk -v target="${{ matrix.target }}" '
            BEGIN { in_targets = 0 }
            /^    targets:/ {
              print
              print "      - " target
              in_targets = 1
              next
            }
            in_targets {
              if ($0 ~ /^      - /) {
                next
              }
              in_targets = 0
            }
            { print }
          ' .goreleaser.yaml > "$TARGET_CONFIG_PATH"
          echo "config_path=$TARGET_CONFIG_PATH" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser (Build & Archive native target)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          # Use rendered config with a single matrix target per runner.
          args: release --clean --skip=publish --config ${{ steps.prepare_goreleaser_config.outputs.config_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: choysum-binaries-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: choysum-binaries-*
          merge-multiple: true

      - name: Create Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Combine checksums from all runners into one unified file
          cat $(find dist-artifacts -name "checksums.txt") | sort -u > combined_checksums.txt
          
          # Find all archives
          ASSETS=$(find dist-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \))
          
          echo "Assets to be uploaded:"
          echo "$ASSETS"
          echo "combined_checksums.txt"

          # Check if the release already exists
          if gh release view ${{ github.ref_name }} > /dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} exists, updating assets..."
            echo $ASSETS | xargs gh release upload ${{ github.ref_name }} --clobber
            gh release upload ${{ github.ref_name }} combined_checksums.txt --clobber
          else
            echo "Creating new release ${{ github.ref_name }}..."
            # --generate-notes automatically generates the changelog
            echo $ASSETS | xargs gh release create ${{ github.ref_name }} --title "Release ${{ github.ref_name }}" --generate-notes combined_checksums.txt
          fi
