name: Publish CLI Release

on:
  workflow_run:
    workflows:
      - Build Release Embedded Assets
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  resolve-release-ref:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    name: Resolve Release Ref
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve tag from commit
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          RELEASE_TAG="$(git tag --points-at "$HEAD_SHA" | grep -E '^v' | head -n1 || true)"
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "No release tag (v*) points at commit $HEAD_SHA" >&2
            exit 1
          fi

          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs:
      - resolve-release-ref
    name: Build CLI Artifacts on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # linux_amd64
          - os: ubuntu-latest
            target: linux_amd64
          # linux_arm64
          - os: ubuntu-24.04-arm
            target: linux_arm64
          # darwin_arm64
          - os: macos-26
            target: darwin_arm64
          # darwin_amd64
          - os: macos-26-intel
            target: darwin_amd64
          # windows_amd64
          - os: windows-latest
            target: windows_amd64
          # windows_arm64
          - os: windows-11-arm
            target: windows_arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release-ref.outputs.head_sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup MSYS2 for windows_amd64
        if: ${{ matrix.target == 'windows_amd64' }}
        id: setup_msys2_windows_amd64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Setup MSYS2 for windows_arm64
        if: ${{ matrix.target == 'windows_arm64' }}
        id: setup_msys2_windows_arm64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            mingw-w64-clang-aarch64-clang

      - name: Download embedded assets
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: release-embedded-assets
          path: ${{ runner.temp }}/release-embedded-assets

      - name: Verify and extract embedded assets
        shell: bash
        run: |
          set -euo pipefail

          ASSET_DIR="${{ runner.temp }}/release-embedded-assets"
          WORKSPACE_PATH="$GITHUB_WORKSPACE"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ASSET_DIR="$(cygpath -u "$ASSET_DIR")"
            WORKSPACE_PATH="$(cygpath -u "$WORKSPACE_PATH")"
          fi

          ARCHIVE_PATH="$ASSET_DIR/release-embedded-assets.tar.gz"
          CHECKSUM_PATH="$ASSET_DIR/release-embedded-assets.tar.gz.sha256"
          SOURCE_SHA_PATH="$ASSET_DIR/source.sha"

          if [[ ! -f "$ARCHIVE_PATH" ]] || [[ ! -f "$CHECKSUM_PATH" ]] || [[ ! -f "$SOURCE_SHA_PATH" ]]; then
            echo "Embedded assets artifact is incomplete under $ASSET_DIR" >&2
            ls -la "$ASSET_DIR" >&2 || true
            exit 1
          fi

          SOURCE_SHA="$(tr -d '\r\n' < "$SOURCE_SHA_PATH")"
          if [[ "$SOURCE_SHA" != "${{ needs.resolve-release-ref.outputs.head_sha }}" ]]; then
            echo "Embedded assets source SHA mismatch: expected ${{ needs.resolve-release-ref.outputs.head_sha }}, got $SOURCE_SHA" >&2
            exit 1
          fi

          (
            cd "$ASSET_DIR"
            sha256sum -c release-embedded-assets.tar.gz.sha256
          )

          tar -xzf "$ARCHIVE_PATH" -C "$WORKSPACE_PATH"

      - name: Configure CGO compiler for windows_amd64
        if: ${{ matrix.target == 'windows_amd64' }}
        shell: bash
        run: |
          set -euo pipefail
          MSYS2_LOCATION="${{ steps.setup_msys2_windows_amd64.outputs.msys2-location }}"
          if [[ -z "$MSYS2_LOCATION" ]]; then
            echo "MSYS2 setup output is empty for windows_amd64" >&2
            exit 1
          fi
          POSIX_ROOT="$(cygpath -u "$MSYS2_LOCATION")"
          BIN_DIR="$POSIX_ROOT/ucrt64/bin"
          if [[ ! -x "$BIN_DIR/gcc.exe" ]] || [[ ! -x "$BIN_DIR/g++.exe" ]]; then
            echo "MSYS2 UCRT64 gcc/g++ not found under $MSYS2_LOCATION\\ucrt64\\bin" >&2
            exit 1
          fi
          GCC_TARGET="$($BIN_DIR/gcc.exe -dumpmachine | tr -d '\r')"
          echo "GCC_TARGET=$GCC_TARGET"
          if ! printf '%s\n' "$GCC_TARGET" | grep -Eiq 'mingw'; then
            echo "Unexpected gcc target for windows_amd64; require MinGW target" >&2
            exit 1
          fi

          WIN_BIN="$(cygpath -w "$BIN_DIR" | tr -d '\r')"
          WIN_GCC_PATH="${WIN_BIN}\\gcc.exe"
          WIN_GXX_PATH="${WIN_BIN}\\g++.exe"
          echo "$WIN_BIN" >> "$GITHUB_PATH"
          echo "CC=$WIN_GCC_PATH" >> "$GITHUB_ENV"
          echo "CXX=$WIN_GXX_PATH" >> "$GITHUB_ENV"
          echo "Using gcc from $WIN_BIN"

      - name: Configure CGO compiler for windows_arm64
        if: ${{ matrix.target == 'windows_arm64' }}
        shell: bash
        run: |
          set -euo pipefail
          MSYS2_LOCATION="${{ steps.setup_msys2_windows_arm64.outputs.msys2-location }}"
          if [[ -z "$MSYS2_LOCATION" ]]; then
            echo "MSYS2 setup output is empty for windows_arm64" >&2
            exit 1
          fi
          POSIX_ROOT="$(cygpath -u "$MSYS2_LOCATION")"
          BIN_DIR="$POSIX_ROOT/clangarm64/bin"
          if [[ ! -x "$BIN_DIR/clang.exe" ]] || [[ ! -x "$BIN_DIR/clang++.exe" ]]; then
            echo "MSYS2 CLANGARM64 clang/clang++ not found under $MSYS2_LOCATION\\clangarm64\\bin" >&2
            exit 1
          fi

          WIN_BIN="$(cygpath -w "$BIN_DIR" | tr -d '\r')"
          echo "$WIN_BIN" >> "$GITHUB_PATH"
          echo "CC=${WIN_BIN}\\clang.exe" >> "$GITHUB_ENV"
          echo "CXX=${WIN_BIN}\\clang++.exe" >> "$GITHUB_ENV"
          echo "Using clang from $WIN_BIN"
          CLANG_VERSION="$($BIN_DIR/clang.exe --version | tr -d '\r')"
          echo "$CLANG_VERSION"
          if printf '%s\n' "$CLANG_VERSION" | grep -Eiq '^Target: .*windows-msvc'; then
            echo "Unexpected MSVC clang target for windows_arm64; require MSYS2 clangarm64 GNU target" >&2
            exit 1
          fi

      - name: Print CGO compiler env
        if: ${{ matrix.target == 'windows_arm64' || matrix.target == 'windows_amd64' }}
        shell: bash
        run: |
          echo "CC=$CC"
          echo "CXX=$CXX"
          go env CC CXX GOOS GOARCH

      - name: Prepare GoReleaser config for current target
        id: prepare_goreleaser_config
        shell: bash
        run: |
          TARGET_CONFIG_PATH="$RUNNER_TEMP/goreleaser.target.yaml"
          awk -v target="${{ matrix.target }}" '
            BEGIN { in_targets = 0 }
            /^    targets:/ {
              print
              print "      - " target
              in_targets = 1
              next
            }
            in_targets {
              if ($0 ~ /^      - /) {
                next
              }
              in_targets = 0
            }
            { print }
          ' .goreleaser.yaml > "$TARGET_CONFIG_PATH"
          echo "config_path=$TARGET_CONFIG_PATH" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser (Build & Archive native target)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --skip=publish --config ${{ steps.prepare_goreleaser_config.outputs.config_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: choysum-binaries-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish CLI GitHub Release
    needs:
      - resolve-release-ref
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release-ref.outputs.head_sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: choysum-binaries-*
          merge-multiple: true

      - name: Create Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${{ needs.resolve-release-ref.outputs.release_tag }}"

          cat $(find dist-artifacts -name "checksums.txt") | sort -u > combined_checksums.txt
          ASSETS=$(find dist-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \))

          echo "Assets to be uploaded:"
          echo "$ASSETS"
          echo "combined_checksums.txt"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists, updating assets..."
            echo $ASSETS | xargs gh release upload "$TAG" --clobber
            gh release upload "$TAG" combined_checksums.txt --clobber
          else
            echo "Creating new release $TAG..."
            echo $ASSETS | xargs gh release create "$TAG" --title "Release $TAG" --generate-notes combined_checksums.txt
          fi
