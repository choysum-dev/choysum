name: Release CLI

on:
  push:
    tags:
      - 'v*' # 只有在推送 v 开头的 tag 时才会触发发版（如 v1.5.0）

permissions:
  contents: write # 发布 release 必须要写权限

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Goreleaser 需要全量 git 历史和标签信息才能构建 changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}