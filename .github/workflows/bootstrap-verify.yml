name: Bootstrap Verify

on:
  workflow_call:
    inputs:
      run_bootstrap_verify:
        description: "Whether bootstrap verify should run"
        required: false
        default: "true"
        type: string

permissions:
  contents: read

jobs:
  bootstrap-verify:
    name: bootstrap-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ inputs.run_bootstrap_verify == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node (vuevirtual npm deps)
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build Vue SFC embed asset (go generate)
        run: go generate ./pkg/jsengine/scripts/vuesfc/...

      - name: Build Vue virtual embed asset (go generate)
        run: |
          npm install --prefix pkg/jsengine/scripts/vuevirtual
          go generate ./pkg/jsengine/scripts/vuevirtual/...

      - name: Generate bootstrap web assets (go generate)
        run: go generate ./internal/bootstrap/web/...

      - name: Verify bootstrap embed contract
        run: go test ./internal/bootstrap/web -count=1 -v

      - name: Verify bootstrap service layer
        run: go test ./internal/bootstrap/service/... -count=1 -v

      - name: Verify full Go build
        run: go build ./...
