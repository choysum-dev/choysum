name: PR Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to run PR Gate against
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare-embedded-assets:
    name: pr / prepare-embedded-assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            internal/bootstrap/web/package-lock.json
            pkg/jsengine/scripts/vuesfc/package-lock.json

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Vue SFC npm dependencies
        working-directory: pkg/jsengine/scripts/vuesfc
        run: npm ci

      - name: Build Vue SFC embed asset
        working-directory: pkg/jsengine/scripts/vuesfc
        run: npm run build

      - name: Install bootstrap npm dependencies
        working-directory: internal/bootstrap/web
        run: npm ci

      - name: Build bootstrap dist
        working-directory: internal/bootstrap/web
        run: npm run build

      - name: Pack embedded assets
        run: |
          mkdir -p .choysum/tmp
          tar -czf .choysum/tmp/pr-embedded-assets.tar.gz \
            internal/bootstrap/web/dist \
            pkg/jsengine/scripts/vuesfc/dist/index.js

      - name: Upload embedded assets
        uses: actions/upload-artifact@v4
        with:
          name: pr-embedded-assets
          path: .choysum/tmp/pr-embedded-assets.tar.gz
          if-no-files-found: error
          retention-days: 1

  discover-addons:
    name: pr / discover-addons
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      modules_json: ${{ steps.discover.outputs.modules_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Discover addon modules
        id: discover
        run: |
          modules_json=$(
            find addons -mindepth 1 -maxdepth 1 -type d \
              | sed 's#^addons/##' \
              | awk '$0 != ".choysum" && $0 != "tmp"' \
              | sort \
              | awk 'BEGIN { printf "[" } { printf "%s\"%s\"", sep, $0; sep="," } END { print "]" }'
          )
          echo "modules_json=${modules_json}" >> "$GITHUB_OUTPUT"
          echo "modules_json=${modules_json}"

  prepare-root-node-modules:
    name: pr / prepare-root-node-modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Pack root node_modules
        run: |
          mkdir -p .choysum/tmp
          tar -czf .choysum/tmp/pr-root-node-modules.tar.gz node_modules

      - name: Upload root node_modules
        uses: actions/upload-artifact@v4
        with:
          name: pr-root-node-modules
          path: .choysum/tmp/pr-root-node-modules.tar.gz
          if-no-files-found: error
          retention-days: 1

  go-test:
    name: pr / go-test
    needs:
      - prepare-embedded-assets
      - prepare-root-node-modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download embedded assets
        uses: actions/download-artifact@v4
        with:
          name: pr-embedded-assets
          path: .choysum/tmp

      - name: Extract embedded assets
        run: tar -xzf .choysum/tmp/pr-embedded-assets.tar.gz -C .

      - name: Download root node_modules
        uses: actions/download-artifact@v4
        with:
          name: pr-root-node-modules
          path: .choysum/tmp

      - name: Extract root node_modules
        run: tar -xzf .choysum/tmp/pr-root-node-modules.tar.gz -C .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run go build
        run: go build ./...

      - name: Run go test
        run: |
          mkdir -p .choysum/coverage/pr
          go test ./... -count=1 -covermode=atomic -coverprofile=.choysum/coverage/pr/go.out

      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          disable_search: true
          fail_ci_if_error: true
          files: .choysum/coverage/pr/go.out
          name: pr-gate-go
          use_oidc: true
          verbose: true

  typecheck-shard:
    name: pr / typecheck-shard (${{ matrix.module }})
    needs:
      - prepare-embedded-assets
      - discover-addons
      - prepare-root-node-modules
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-addons.outputs.modules_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download embedded assets
        uses: actions/download-artifact@v4
        with:
          name: pr-embedded-assets
          path: .choysum/tmp

      - name: Extract embedded assets
        run: tar -xzf .choysum/tmp/pr-embedded-assets.tar.gz -C .

      - name: Download root node_modules
        uses: actions/download-artifact@v4
        with:
          name: pr-root-node-modules
          path: .choysum/tmp

      - name: Extract root node_modules
        run: tar -xzf .choysum/tmp/pr-root-node-modules.tar.gz -C .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run addon typecheck
        run: go run . test typecheck ${{ matrix.module }}

  typecheck-all:
    name: pr / typecheck-all
    needs:
      - typecheck-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify typecheck matrix result
        run: |
          echo "typecheck-shard result=${{ needs.typecheck-shard.result }}"
          if [ "${{ needs.typecheck-shard.result }}" != "success" ]; then
            exit 1
          fi

  unit-shard:
    name: pr / unit-shard (${{ matrix.module }})
    needs:
      - prepare-embedded-assets
      - discover-addons
      - prepare-root-node-modules
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-addons.outputs.modules_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download embedded assets
        uses: actions/download-artifact@v4
        with:
          name: pr-embedded-assets
          path: .choysum/tmp

      - name: Extract embedded assets
        run: tar -xzf .choysum/tmp/pr-embedded-assets.tar.gz -C .

      - name: Download root node_modules
        uses: actions/download-artifact@v4
        with:
          name: pr-root-node-modules
          path: .choysum/tmp

      - name: Extract root node_modules
        run: tar -xzf .choysum/tmp/pr-root-node-modules.tar.gz -C .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run unit tests with coverage and JUnit
        id: unit_tests
        run: |
          coverage_root=".choysum/coverage/pr/unit/${{ matrix.module }}"
          junit_root=".choysum/test-results/pr/unit"
          backend_lcov="$coverage_root/lcov.info"
          frontend_lcov="$coverage_root/fe/${{ matrix.module }}/lcov.info"
          backend_junit="$junit_root/${{ matrix.module }}.backend.junit.xml"
          frontend_junit="$junit_root/${{ matrix.module }}.frontend.junit.xml"

          mkdir -p "$coverage_root" "$junit_root"

          set +e
          go run . test unit "${{ matrix.module }}" \
            --coverage \
            --coverage-report \
            --coverage-report-dir "$coverage_root" \
            --coverage-reporters lcovonly \
            --junit "$junit_root/${{ matrix.module }}.{scope}.junit.xml"
          exit_code=$?
          set -e

          coverage_files=""
          if [ -f "$backend_lcov" ]; then
            coverage_files="$backend_lcov"
          fi
          if [ -f "$frontend_lcov" ]; then
            if [ -n "$coverage_files" ]; then
              coverage_files="$coverage_files,$frontend_lcov"
            else
              coverage_files="$frontend_lcov"
            fi
          fi

          test_result_files=""
          if [ -f "$backend_junit" ]; then
            test_result_files="$backend_junit"
          fi
          if [ -f "$frontend_junit" ]; then
            if [ -n "$test_result_files" ]; then
              test_result_files="$test_result_files,$frontend_junit"
            else
              test_result_files="$frontend_junit"
            fi
          fi

          echo "coverage_files=$coverage_files" >> "$GITHUB_OUTPUT"
          echo "test_result_files=$test_result_files" >> "$GITHUB_OUTPUT"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload unit coverage to Codecov
        if: ${{ !cancelled() && steps.unit_tests.outputs.coverage_files != '' }}
        uses: codecov/codecov-action@v6
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ${{ steps.unit_tests.outputs.coverage_files }}
          name: pr-gate-unit-${{ matrix.module }}-coverage
          use_oidc: true
          verbose: true

      - name: Upload unit test results to Codecov
        if: ${{ !cancelled() && steps.unit_tests.outputs.test_result_files != '' }}
        uses: codecov/codecov-action@v6
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ${{ steps.unit_tests.outputs.test_result_files }}
          name: pr-gate-unit-${{ matrix.module }}-tests
          report_type: test_results
          use_oidc: true
          verbose: true

      - name: Fail unit shard if tests failed
        if: ${{ steps.unit_tests.outputs.exit_code != '0' }}
        run: exit "${{ steps.unit_tests.outputs.exit_code }}"

  unit-all:
    name: pr / unit-all
    needs:
      - unit-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify unit matrix result
        run: |
          echo "unit-shard result=${{ needs.unit-shard.result }}"
          if [ "${{ needs.unit-shard.result }}" != "success" ]; then
            exit 1
          fi

  e2e-shard:
    name: pr / e2e-shard (${{ matrix.module }})
    needs:
      - prepare-embedded-assets
      - discover-addons
      - prepare-root-node-modules
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-addons.outputs.modules_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download embedded assets
        uses: actions/download-artifact@v4
        with:
          name: pr-embedded-assets
          path: .choysum/tmp

      - name: Extract embedded assets
        run: tar -xzf .choysum/tmp/pr-embedded-assets.tar.gz -C .

      - name: Download root node_modules
        uses: actions/download-artifact@v4
        with:
          name: pr-root-node-modules
          path: .choysum/tmp

      - name: Extract root node_modules
        run: tar -xzf .choysum/tmp/pr-root-node-modules.tar.gz -C .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: go run . test e2e ${{ matrix.module }}

  e2e-all:
    name: pr / e2e-all
    needs:
      - e2e-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify e2e matrix result
        run: |
          echo "e2e-shard result=${{ needs.e2e-shard.result }}"
          if [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            exit 1
          fi

  bootstrap-verify:
    name: pr / bootstrap-verify
    needs: prepare-embedded-assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download embedded assets
        uses: actions/download-artifact@v4
        with:
          name: pr-embedded-assets
          path: .choysum/tmp

      - name: Extract embedded assets
        run: tar -xzf .choysum/tmp/pr-embedded-assets.tar.gz -C .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/bootstrap/web/package-lock.json

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install bootstrap npm dependencies
        working-directory: internal/bootstrap/web
        run: npm ci

      - name: Run bootstrap verify
        working-directory: internal/bootstrap/web
        run: npm run verify:bootstrap:release
