name: PR Gate

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover-impact:
    name: pr / discover-impact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.discover.outputs.docs_only }}
      direct_modules_json: ${{ steps.discover.outputs.direct_modules_json }}
      impacted_direct_e2e_modules_json: ${{ steps.discover.outputs.impacted_direct_e2e_modules_json }}
      impacted_modules_json: ${{ steps.discover.outputs.impacted_modules_json }}
      impacted_smoke_e2e_modules_json: ${{ steps.discover.outputs.impacted_smoke_e2e_modules_json }}
      run_full_matrix: ${{ steps.discover.outputs.run_full_matrix }}
      run_go_test: ${{ steps.discover.outputs.run_go_test }}
      run_pr_smoke_e2e: ${{ steps.discover.outputs.run_pr_smoke_e2e }}
      reason: ${{ steps.discover.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Discover PR impact
        id: discover
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/pr_gate_discover_impact.py

      - name: Log discover routing outputs
        env:
          RUN_FULL_MATRIX: ${{ steps.discover.outputs.run_full_matrix }}
          RUN_GO_TEST: ${{ steps.discover.outputs.run_go_test }}
          DOCS_ONLY: ${{ steps.discover.outputs.docs_only }}
          DISCOVER_REASON: ${{ steps.discover.outputs.reason }}
        run: |
          set -euo pipefail
          echo "run_full_matrix=${RUN_FULL_MATRIX}"
          echo "run_go_test=${RUN_GO_TEST}"
          echo "docs_only=${DOCS_ONLY}"
          echo "reason=${DISCOVER_REASON}"

  prepare-embedded-assets:
    name: pr / prepare-embedded-assets
    needs:
      - discover-impact
    uses: ./.github/workflows/prepare-embedded-assets.yml
    with:
      artifact_name: pr-embedded-assets
      archive_path: .choysum/tmp/pr-embedded-assets.tar.gz
      retention_days: 1
      docs_only: ${{ needs.discover-impact.outputs.docs_only }}

  build-choysum-cli:
    name: pr / build-choysum-cli
    if: >-
      ${{ needs.discover-impact.outputs.docs_only != 'true' &&
      (needs.discover-impact.outputs.impacted_modules_json != '[]' ||
      needs.discover-impact.outputs.impacted_smoke_e2e_modules_json != '[]' ||
      needs.discover-impact.outputs.impacted_direct_e2e_modules_json != '[]') }}
    needs:
      - discover-impact
      - prepare-embedded-assets
    uses: ./.github/workflows/build-choysum-cli.yml
    with:
      embedded_assets_artifact_name: pr-embedded-assets
      embedded_assets_archive_path: .choysum/tmp/pr-embedded-assets.tar.gz
      choysum_artifact_name: pr-choysum-cli
      choysum_binary_path: .choysum/tmp/choysum
      retention_days: 1
      # Warm only when typecheck will run; smoke/e2e-only PRs should not wait on esm.sh.
      warm_typecheck_types: ${{ needs.discover-impact.outputs.impacted_modules_json != '[]' && 'true' || 'false' }}
      modules_tsconfig_artifact_name: ${{ needs.discover-impact.outputs.impacted_modules_json != '[]' && 'pr-modules-tsconfig' || '' }}

  go-test-shards:
    name: pr / go-test (${{ matrix.shard }})
    needs:
      - discover-impact
      - prepare-embedded-assets
    if: ${{ needs.discover-impact.outputs.run_go_test == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: testing
            chromium: "true"
          - shard: module
            chromium: "false"
          - shard: runtime
            chromium: "false"
          - shard: rest
            chromium: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download and extract embedded assets
        uses: ./.github/actions/download-extract-embedded-assets
        with:
          artifact-name: pr-embedded-assets
          archive-path: .choysum/tmp/pr-embedded-assets.tar.gz

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go-test shard partition
        if: ${{ matrix.shard == 'testing' }}
        run: |
          set -euo pipefail
          python3 scripts/ci/go_test_shards_test.py
          python3 scripts/ci/go_test_shards.py check

      - name: Install Chromium for e2e unit coverage
        if: ${{ matrix.chromium == 'true' }}
        run: |
          set -euo pipefail
          python3 scripts/ci/install_chromium.py
          echo "CHOYSUM_HOME=${CHOYSUM_HOME:-$HOME/.choysum}" >> "$GITHUB_ENV"

      # Coverage compile already typechecks; a separate `go build ./...` only doubles wall clock.
      - name: Run go test shard
        run: |
          set -euo pipefail
          mkdir -p .choysum/coverage/pr
          if ! pkg_list="$(python3 scripts/ci/go_test_shards.py packages "${{ matrix.shard }}")"; then
            echo "error: failed to resolve packages for shard ${{ matrix.shard }}" >&2
            exit 1
          fi
          if [[ -z "${pkg_list}" ]]; then
            echo "error: shard ${{ matrix.shard }} has no packages" >&2
            exit 1
          fi
          mapfile -t pkgs <<< "${pkg_list}"
          ./scripts/ci/record_cmd_wall.sh \
            go test "${pkgs[@]}" -count=1 -covermode=atomic \
            -coverprofile=".choysum/coverage/pr/shard-${{ matrix.shard }}.out"

      - name: Upload shard coverprofile
        uses: actions/upload-artifact@v7
        with:
          name: pr-go-cover-${{ matrix.shard }}
          path: .choysum/coverage/pr/shard-${{ matrix.shard }}.out
          if-no-files-found: error
          retention-days: 1

  go-test:
    name: pr / go-test
    needs:
      - discover-impact
      - go-test-shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Fail when routing job did not succeed
        if: ${{ needs.discover-impact.result != 'success' }}
        env:
          DISCOVER_RESULT: ${{ needs.discover-impact.result }}
        run: |
          echo "discover-impact did not succeed (result=${DISCOVER_RESULT}); refusing to report green." >&2
          exit 1

      - name: Skip Go baseline when routing says no
        if: ${{ needs.discover-impact.result == 'success' && needs.discover-impact.outputs.run_go_test == 'false' }}
        env:
          RUN_GO_TEST: ${{ needs.discover-impact.outputs.run_go_test }}
          DISCOVER_REASON: ${{ needs.discover-impact.outputs.reason }}
        run: echo "go test skipped by routing (run_go_test=${RUN_GO_TEST}; reason=${DISCOVER_REASON})"

      - name: Fail on unrecognized routing output
        if: ${{ needs.discover-impact.result == 'success' && needs.discover-impact.outputs.run_go_test != 'true' && needs.discover-impact.outputs.run_go_test != 'false' }}
        env:
          RUN_GO_TEST: ${{ needs.discover-impact.outputs.run_go_test }}
        run: |
          echo "unexpected run_go_test value '${RUN_GO_TEST}'; refusing to report green." >&2
          exit 1

      - name: Verify go-test shards
        if: ${{ needs.discover-impact.result == 'success' && needs.discover-impact.outputs.run_go_test == 'true' }}
        env:
          SHARD_RESULT: ${{ needs.go-test-shards.result }}
        run: |
          set -euo pipefail
          echo "go-test-shards result=${SHARD_RESULT}"
          if [[ "${SHARD_RESULT}" != "success" ]]; then
            {
              echo "### go-test shards failed"
              echo
              echo "Aggregate check \`pr / go-test\` is red because one or more matrix jobs failed."
              echo "Inspect jobs named \`pr / go-test (<shard>)\` — shards: \`testing\`, \`module\`, \`runtime\`, \`rest\`."
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}" || true
            echo "One or more go-test shards failed (result=${SHARD_RESULT})." >&2
            echo "Inspect matrix jobs: pr / go-test (testing|module|runtime|rest)." >&2
            exit 1
          fi

      - name: Checkout
        if: ${{ needs.discover-impact.result == 'success' && needs.discover-impact.outputs.run_go_test == 'true' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download shard coverprofiles
        if: ${{ needs.discover-impact.result == 'success' && needs.discover-impact.outputs.run_go_test == 'true' }}
        uses: actions/download-artifact@v8
        with:
          pattern: pr-go-cover-*
          path: .choysum/coverage/pr/shards
          merge-multiple: true

      - name: Merge coverprofiles
        if: ${{ needs.discover-impact.result == 'success' && needs.discover-impact.outputs.run_go_test == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p .choysum/coverage/pr
          mapfile -t inputs < <(find .choysum/coverage/pr/shards -type f -name 'shard-*.out' | sort)
          if [[ ${#inputs[@]} -eq 0 ]]; then
            echo "error: no shard coverprofiles downloaded" >&2
            exit 1
          fi
          python3 scripts/ci/go_test_shards.py merge-coverprofiles \
            --require-all-shards \
            -o .choysum/coverage/pr/go.out "${inputs[@]}"
          ls -la .choysum/coverage/pr/go.out

      - name: Upload Go coverage to Codecov
        if: ${{ needs.discover-impact.result == 'success' && needs.discover-impact.outputs.run_go_test == 'true' }}
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: false
          files: .choysum/coverage/pr/go.out
          name: pr-gate-go
          use_oidc: true
          verbose: true

  typecheck-shard:
    name: pr / typecheck-shard (${{ matrix.module }})
    if: ${{ needs.discover-impact.outputs.impacted_modules_json != '[]' }}
    needs:
      - discover-impact
      - build-choysum-cli
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-impact.outputs.impacted_modules_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download choysum CLI
        uses: actions/download-artifact@v8
        with:
          name: pr-choysum-cli
          path: .choysum/tmp

      - name: Make choysum CLI executable
        run: chmod +x .choysum/tmp/choysum

      - name: Setup CLI testing pkg cache
        uses: ./.github/actions/setup-cli-testing-cache

      - name: Download modules tsconfig path maps
        uses: actions/download-artifact@v8
        with:
          name: pr-modules-tsconfig
          path: modules

      - name: Run module typecheck
        run: |
          CHOYSUM_BIN="$(pwd)/.choysum/tmp/choysum"
          "$CHOYSUM_BIN" test typecheck ${{ matrix.module }}

  typecheck-all:
    name: pr / typecheck-all
    needs:
      - discover-impact
      - typecheck-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip typecheck aggregate when routing produces no modules
        if: ${{ needs.discover-impact.outputs.impacted_modules_json == '[]' }}
        run: echo "typecheck skipped by routing"

      - name: Verify typecheck matrix result
        if: ${{ needs.discover-impact.outputs.impacted_modules_json != '[]' }}
        run: |
          echo "typecheck-shard result=${{ needs.typecheck-shard.result }}"
          if [ "${{ needs.typecheck-shard.result }}" != "success" ]; then
            exit 1
          fi

  unit-shard:
    name: pr / unit-shard (${{ matrix.module }})
    if: ${{ needs.discover-impact.outputs.impacted_modules_json != '[]' }}
    needs:
      - discover-impact
      - build-choysum-cli
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-impact.outputs.impacted_modules_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download choysum CLI
        uses: actions/download-artifact@v8
        with:
          name: pr-choysum-cli
          path: .choysum/tmp

      - name: Make choysum CLI executable
        run: chmod +x .choysum/tmp/choysum

      - name: Setup CLI testing pkg cache
        uses: ./.github/actions/setup-cli-testing-cache

      - name: Run unit tests with coverage and JUnit
        id: unit_tests
        env:
          MODULE: ${{ matrix.module }}
        run: |
          coverage_root=".choysum/coverage/pr/unit/$MODULE"
          junit_root=".choysum/test-results/pr/unit"

          mkdir -p "$coverage_root" "$junit_root"

          set +e
          CHOYSUM_BIN="$(pwd)/.choysum/tmp/choysum"
          "$CHOYSUM_BIN" test unit "$MODULE" \
            --coverage \
            --coverage-report \
            --fe-coverage-all \
            --coverage-report-dir "$coverage_root" \
            --coverage-reporters lcovonly \
            --junit "$junit_root/$MODULE.{scope}.junit.xml"
          exit_code=$?
          set -e

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      # Upload the unit/ parent so merge-multiple keeps per-module directories.
      - name: Upload unit coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-unit-cover-${{ matrix.module }}
          path: .choysum/coverage/pr/unit
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload unit junit artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-unit-junit-${{ matrix.module }}
          path: .choysum/test-results/pr/unit
          if-no-files-found: ignore
          retention-days: 1

      - name: Fail unit shard if tests failed
        if: ${{ steps.unit_tests.outputs.exit_code != '0' }}
        run: exit "${{ steps.unit_tests.outputs.exit_code }}"

  unit-all:
    name: pr / unit-all
    needs:
      - discover-impact
      - unit-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Skip unit aggregate when routing produces no modules
        if: ${{ needs.discover-impact.outputs.impacted_modules_json == '[]' }}
        run: echo "unit tests skipped by routing"

      - name: Download unit coverage artifacts
        if: ${{ needs.discover-impact.outputs.impacted_modules_json != '[]' && needs.unit-shard.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: pr-unit-cover-*
          path: .choysum/coverage/pr/unit
          merge-multiple: true

      - name: Download unit junit artifacts
        if: ${{ needs.discover-impact.outputs.impacted_modules_json != '[]' && needs.unit-shard.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: pr-unit-junit-*
          path: .choysum/test-results/pr/unit
          merge-multiple: true

      - name: Collect unit coverage and junit paths
        id: collect_codecov
        if: ${{ needs.discover-impact.outputs.impacted_modules_json != '[]' && needs.unit-shard.result != 'skipped' }}
        run: |
          set -euo pipefail
          coverage_files=""
          while IFS= read -r f; do
            if [[ -n "$coverage_files" ]]; then
              coverage_files="${coverage_files},${f}"
            else
              coverage_files="${f}"
            fi
          done < <(find .choysum/coverage/pr/unit -type f -name 'lcov.info' -size +0c 2>/dev/null | sort || true)

          test_result_files=""
          while IFS= read -r f; do
            if [[ -n "$test_result_files" ]]; then
              test_result_files="${test_result_files},${f}"
            else
              test_result_files="${f}"
            fi
          done < <(find .choysum/test-results/pr/unit -type f -name '*.junit.xml' 2>/dev/null | sort || true)

          if [[ -z "$coverage_files" ]]; then
            echo "::warning title=unit coverage::no lcov.info collected although modules were impacted (Codecov upload will be skipped)"
          fi

          echo "coverage_files=${coverage_files}" >> "$GITHUB_OUTPUT"
          echo "test_result_files=${test_result_files}" >> "$GITHUB_OUTPUT"

      - name: Upload unit coverage to Codecov
        if: ${{ needs.discover-impact.outputs.impacted_modules_json != '[]' && needs.unit-shard.result != 'skipped' && steps.collect_codecov.outputs.coverage_files != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: false
          files: ${{ steps.collect_codecov.outputs.coverage_files }}
          name: pr-gate-unit
          use_oidc: true
          verbose: true

      - name: Upload unit test results to Codecov
        if: ${{ needs.discover-impact.outputs.impacted_modules_json != '[]' && needs.unit-shard.result != 'skipped' && steps.collect_codecov.outputs.test_result_files != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: false
          files: ${{ steps.collect_codecov.outputs.test_result_files }}
          name: pr-gate-unit
          report_type: test_results
          use_oidc: true
          verbose: true

      - name: Verify unit matrix result
        if: ${{ needs.discover-impact.outputs.impacted_modules_json != '[]' }}
        run: |
          echo "unit-shard result=${{ needs.unit-shard.result }}"
          if [ "${{ needs.unit-shard.result }}" != "success" ]; then
            exit 1
          fi

  smoke-e2e-shard:
    name: pr / smoke-e2e-shard (${{ matrix.module }})
    if: ${{ needs.discover-impact.outputs.run_pr_smoke_e2e == 'true' && needs.discover-impact.outputs.impacted_smoke_e2e_modules_json != '[]' }}
    needs:
      - discover-impact
      - build-choysum-cli
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-impact.outputs.impacted_smoke_e2e_modules_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download choysum CLI
        uses: actions/download-artifact@v8
        with:
          name: pr-choysum-cli
          path: .choysum/tmp

      - name: Make choysum CLI executable
        run: chmod +x .choysum/tmp/choysum

      - name: Setup CLI testing pkg cache
        uses: ./.github/actions/setup-cli-testing-cache

      - name: Setup Chromium
        uses: ./.github/actions/setup-chromium

      - name: Run smoke E2E suite
        env:
          CHOYSUM_BIN: ${{ github.workspace }}/.choysum/tmp/choysum
          MODULE: ${{ matrix.module }}
          E2E_MAX_ATTEMPTS: "2"
          E2E_EXTRA_ARGS: "-- smoke.spec.ts"
        run: bash scripts/ci/run_e2e_with_retry.sh

  e2e-shard-targeted:
    name: pr / e2e-shard-targeted (${{ matrix.module }})
    if: ${{ needs.discover-impact.outputs.impacted_direct_e2e_modules_json != '[]' }}
    needs:
      - discover-impact
      - build-choysum-cli
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-impact.outputs.impacted_direct_e2e_modules_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download choysum CLI
        uses: actions/download-artifact@v8
        with:
          name: pr-choysum-cli
          path: .choysum/tmp

      - name: Make choysum CLI executable
        run: chmod +x .choysum/tmp/choysum

      - name: Setup CLI testing pkg cache
        uses: ./.github/actions/setup-cli-testing-cache

      - name: Setup Chromium
        uses: ./.github/actions/setup-chromium

      - name: Run targeted E2E suite
        env:
          CHOYSUM_BIN: ${{ github.workspace }}/.choysum/tmp/choysum
          MODULE: ${{ matrix.module }}
          E2E_MAX_ATTEMPTS: "2"
        run: bash scripts/ci/run_e2e_with_retry.sh

  e2e-all:
    name: pr / e2e-all
    needs:
      - discover-impact
      - smoke-e2e-shard
      - e2e-shard-targeted
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip smoke E2E aggregate when routing produces no smoke modules
        if: ${{ needs.discover-impact.outputs.run_pr_smoke_e2e != 'true' || needs.discover-impact.outputs.impacted_smoke_e2e_modules_json == '[]' }}
        run: echo "smoke E2E skipped by routing"

      - name: Verify smoke E2E matrix result
        if: ${{ needs.discover-impact.outputs.run_pr_smoke_e2e == 'true' && needs.discover-impact.outputs.impacted_smoke_e2e_modules_json != '[]' }}
        run: |
          echo "smoke-e2e-shard result=${{ needs.smoke-e2e-shard.result }}"
          if [ "${{ needs.smoke-e2e-shard.result }}" != "success" ]; then
            exit 1
          fi

      - name: Skip targeted E2E aggregate when routing produces no direct E2E module edits
        if: ${{ needs.discover-impact.outputs.impacted_direct_e2e_modules_json == '[]' }}
        run: echo "targeted E2E skipped by routing"

      - name: Verify targeted E2E matrix result
        if: ${{ needs.discover-impact.outputs.impacted_direct_e2e_modules_json != '[]' }}
        run: |
          echo "e2e-shard-targeted result=${{ needs.e2e-shard-targeted.result }}"
          if [ "${{ needs.e2e-shard-targeted.result }}" != "success" ]; then
            exit 1
          fi
