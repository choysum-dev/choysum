name: PR Gate

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to run PR Gate against
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover-impact:
    name: pr / discover-impact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.discover.outputs.docs_only }}
      direct_modules_json: ${{ steps.discover.outputs.direct_modules_json }}
      impacted_direct_e2e_no_smoke_modules_json: ${{ steps.discover.outputs.impacted_direct_e2e_no_smoke_modules_json }}
      impacted_modules_json: ${{ steps.discover.outputs.impacted_modules_json }}
      impacted_smoke_e2e_modules_json: ${{ steps.discover.outputs.impacted_smoke_e2e_modules_json }}
      run_full_matrix: ${{ steps.discover.outputs.run_full_matrix }}
      run_bootstrap_verify: ${{ steps.discover.outputs.run_bootstrap_verify }}
      run_go_test: ${{ steps.discover.outputs.run_go_test }}
      run_pr_smoke_e2e: ${{ steps.discover.outputs.run_pr_smoke_e2e }}
      reason: ${{ steps.discover.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Discover PR impact
        id: discover
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/pr_gate_discover_impact.py

  prepare-embedded-assets:
    name: pr / prepare-embedded-assets
    needs:
      - discover-impact
    uses: ./.github/workflows/prepare-embedded-assets.yml
    with:
      run_ref: ${{ inputs.ref || github.ref }}
      artifact_name: pr-embedded-assets
      archive_path: .choysum/tmp/pr-embedded-assets.tar.gz
      retention_days: 1
      docs_only: ${{ needs.discover-impact.outputs.docs_only }}

  prepare-root-node-modules:
    name: pr / prepare-root-node-modules
    needs:
      - discover-impact
    uses: ./.github/workflows/prepare-root-node-modules.yml
    with:
      run_ref: ${{ inputs.ref || github.ref }}
      artifact_name: pr-root-node-modules
      archive_path: .choysum/tmp/pr-root-node-modules.tar.gz
      retention_days: 1
      docs_only: ${{ needs.discover-impact.outputs.docs_only }}
      target_modules_json: ${{ needs.discover-impact.outputs.impacted_modules_json }}

  prepare-playwright-cache:
    name: pr / prepare-playwright-cache
    if: ${{ needs.discover-impact.outputs.docs_only != 'true' && (needs.discover-impact.outputs.run_pr_smoke_e2e == 'true' || needs.discover-impact.outputs.impacted_direct_e2e_no_smoke_modules_json != '[]') }}
    needs:
      - discover-impact
      - prepare-root-node-modules
    uses: ./.github/workflows/prepare-playwright-cache.yml
    with:
      run_ref: ${{ inputs.ref || github.ref }}
      artifact_name: pr-root-node-modules

  build-choysum-cli:
    name: pr / build-choysum-cli
    if: >-
      ${{ needs.discover-impact.outputs.docs_only != 'true' &&
      (needs.discover-impact.outputs.impacted_modules_json != '[]' ||
      needs.discover-impact.outputs.impacted_smoke_e2e_modules_json != '[]' ||
      needs.discover-impact.outputs.impacted_direct_e2e_no_smoke_modules_json != '[]') }}
    needs:
      - discover-impact
      - prepare-embedded-assets
    uses: ./.github/workflows/build-choysum-cli.yml
    with:
      run_ref: ${{ inputs.ref || github.ref }}
      embedded_assets_artifact_name: pr-embedded-assets
      embedded_assets_archive_path: .choysum/tmp/pr-embedded-assets.tar.gz
      choysum_artifact_name: pr-choysum-cli
      choysum_binary_path: .choysum/tmp/choysum
      retention_days: 1

  go-test:
    name: pr / go-test
    needs:
      - discover-impact
      - prepare-embedded-assets
      - prepare-root-node-modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Skip Go baseline when routing says no
        if: ${{ needs.discover-impact.outputs.run_go_test != 'true' }}
        env:
          RUN_GO_TEST: ${{ needs.discover-impact.outputs.run_go_test }}
          DISCOVER_REASON: ${{ needs.discover-impact.outputs.reason }}
        run: echo "go test skipped by routing (run_go_test=${RUN_GO_TEST}; reason=${DISCOVER_REASON})"

      - name: Checkout
        if: ${{ needs.discover-impact.outputs.run_go_test == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download and extract embedded assets
        if: ${{ needs.discover-impact.outputs.run_go_test == 'true' }}
        uses: ./.github/actions/download-extract-embedded-assets
        with:
          artifact-name: pr-embedded-assets
          archive-path: .choysum/tmp/pr-embedded-assets.tar.gz

      - name: Download root node_modules
        if: ${{ needs.discover-impact.outputs.run_go_test == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: pr-root-node-modules
          path: .choysum/tmp

      - name: Extract root node_modules
        if: ${{ needs.discover-impact.outputs.run_go_test == 'true' }}
        run: tar -xzf .choysum/tmp/pr-root-node-modules.tar.gz -C .

      - name: Setup Go
        if: ${{ needs.discover-impact.outputs.run_go_test == 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        if: ${{ needs.discover-impact.outputs.run_go_test == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Coverage compile already typechecks; a separate `go build ./...` only doubles wall clock.
      - name: Run go test
        if: ${{ needs.discover-impact.outputs.run_go_test == 'true' }}
        run: |
          mkdir -p .choysum/coverage/pr
          go test ./... -count=1 -covermode=atomic -coverprofile=.choysum/coverage/pr/go.out

      - name: Upload Go coverage to Codecov
        if: ${{ needs.discover-impact.outputs.run_go_test == 'true' }}
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: false
          files: .choysum/coverage/pr/go.out
          name: pr-gate-go
          use_oidc: true
          verbose: true

  typecheck-shard:
    name: pr / typecheck-shard (${{ matrix.module }})
    if: ${{ needs.discover-impact.outputs.impacted_modules_json != '[]' }}
    needs:
      - prepare-embedded-assets
      - discover-impact
      - prepare-root-node-modules
      - build-choysum-cli
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-impact.outputs.impacted_modules_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download and extract embedded assets
        uses: ./.github/actions/download-extract-embedded-assets
        with:
          artifact-name: pr-embedded-assets
          archive-path: .choysum/tmp/pr-embedded-assets.tar.gz

      - name: Download root node_modules
        uses: actions/download-artifact@v8
        with:
          name: pr-root-node-modules
          path: .choysum/tmp

      - name: Extract root node_modules
        run: tar -xzf .choysum/tmp/pr-root-node-modules.tar.gz -C .

      - name: Add local node_modules bin to PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Download choysum CLI
        uses: actions/download-artifact@v8
        with:
          name: pr-choysum-cli
          path: .choysum/tmp

      - name: Make choysum CLI executable
        run: chmod +x .choysum/tmp/choysum

      - name: Setup CLI testing pkg cache
        uses: ./.github/actions/setup-cli-testing-cache

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run module typecheck
        run: |
          CHOYSUM_BIN="$(pwd)/.choysum/tmp/choysum"
          "$CHOYSUM_BIN" test typecheck ${{ matrix.module }}

  typecheck-all:
    name: pr / typecheck-all
    needs:
      - discover-impact
      - typecheck-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip typecheck aggregate when routing produces no modules
        if: ${{ needs.discover-impact.outputs.impacted_modules_json == '[]' }}
        run: echo "typecheck skipped by routing"

      - name: Verify typecheck matrix result
        if: ${{ needs.discover-impact.outputs.impacted_modules_json != '[]' }}
        run: |
          echo "typecheck-shard result=${{ needs.typecheck-shard.result }}"
          if [ "${{ needs.typecheck-shard.result }}" != "success" ]; then
            exit 1
          fi

  unit-shard:
    name: pr / unit-shard (${{ matrix.module }})
    if: ${{ needs.discover-impact.outputs.impacted_modules_json != '[]' }}
    needs:
      - prepare-embedded-assets
      - discover-impact
      - prepare-root-node-modules
      - build-choysum-cli
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-impact.outputs.impacted_modules_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download and extract embedded assets
        uses: ./.github/actions/download-extract-embedded-assets
        with:
          artifact-name: pr-embedded-assets
          archive-path: .choysum/tmp/pr-embedded-assets.tar.gz

      - name: Download root node_modules
        uses: actions/download-artifact@v8
        with:
          name: pr-root-node-modules
          path: .choysum/tmp

      - name: Extract root node_modules
        run: tar -xzf .choysum/tmp/pr-root-node-modules.tar.gz -C .

      - name: Add local node_modules bin to PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Download choysum CLI
        uses: actions/download-artifact@v8
        with:
          name: pr-choysum-cli
          path: .choysum/tmp

      - name: Make choysum CLI executable
        run: chmod +x .choysum/tmp/choysum

      - name: Setup CLI testing pkg cache
        uses: ./.github/actions/setup-cli-testing-cache

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run unit tests with coverage and JUnit
        id: unit_tests
        run: |
          coverage_root=".choysum/coverage/pr/unit/${{ matrix.module }}"
          junit_root=".choysum/test-results/pr/unit"
          backend_lcov="$coverage_root/lcov.info"
          frontend_lcov="$coverage_root/fe/${{ matrix.module }}/lcov.info"
          backend_junit="$junit_root/${{ matrix.module }}.backend.junit.xml"
          frontend_junit="$junit_root/${{ matrix.module }}.frontend.junit.xml"

          mkdir -p "$coverage_root" "$junit_root"

          set +e
          CHOYSUM_BIN="$(pwd)/.choysum/tmp/choysum"
          "$CHOYSUM_BIN" test unit "${{ matrix.module }}" \
            --coverage \
            --coverage-report \
            --fe-coverage-all \
            --coverage-report-dir "$coverage_root" \
            --coverage-reporters lcovonly \
            --junit "$junit_root/${{ matrix.module }}.{scope}.junit.xml"
          exit_code=$?
          set -e

          coverage_files=""
          if [ -s "$backend_lcov" ]; then
            coverage_files="$backend_lcov"
          fi
          if [ -s "$frontend_lcov" ]; then
            if [ -n "$coverage_files" ]; then
              coverage_files="$coverage_files,$frontend_lcov"
            else
              coverage_files="$frontend_lcov"
            fi
          fi

          test_result_files=""
          if [ -f "$backend_junit" ]; then
            test_result_files="$backend_junit"
          fi
          if [ -f "$frontend_junit" ]; then
            if [ -n "$test_result_files" ]; then
              test_result_files="$test_result_files,$frontend_junit"
            else
              test_result_files="$frontend_junit"
            fi
          fi

          echo "coverage_files=$coverage_files" >> "$GITHUB_OUTPUT"
          echo "test_result_files=$test_result_files" >> "$GITHUB_OUTPUT"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      # Coverage (BE+FE) in one upload; test_results stay separate (different report_type).
      - name: Upload unit coverage to Codecov
        if: ${{ !cancelled() && steps.unit_tests.outputs.coverage_files != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: false
          files: ${{ steps.unit_tests.outputs.coverage_files }}
          name: pr-gate-unit-${{ matrix.module }}-coverage
          use_oidc: true
          verbose: true

      - name: Upload unit test results to Codecov
        if: ${{ !cancelled() && steps.unit_tests.outputs.test_result_files != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: false
          files: ${{ steps.unit_tests.outputs.test_result_files }}
          name: pr-gate-unit-${{ matrix.module }}-tests
          report_type: test_results
          use_oidc: true
          verbose: true

      - name: Fail unit shard if tests failed
        if: ${{ steps.unit_tests.outputs.exit_code != '0' }}
        run: exit "${{ steps.unit_tests.outputs.exit_code }}"

  unit-all:
    name: pr / unit-all
    needs:
      - discover-impact
      - unit-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip unit aggregate when routing produces no modules
        if: ${{ needs.discover-impact.outputs.impacted_modules_json == '[]' }}
        run: echo "unit tests skipped by routing"

      - name: Verify unit matrix result
        if: ${{ needs.discover-impact.outputs.impacted_modules_json != '[]' }}
        run: |
          echo "unit-shard result=${{ needs.unit-shard.result }}"
          if [ "${{ needs.unit-shard.result }}" != "success" ]; then
            exit 1
          fi

  smoke-e2e-shard:
    name: pr / smoke-e2e-shard (${{ matrix.module }})
    if: ${{ needs.discover-impact.outputs.run_pr_smoke_e2e == 'true' && needs.discover-impact.outputs.impacted_smoke_e2e_modules_json != '[]' }}
    needs:
      - prepare-embedded-assets
      - discover-impact
      - prepare-root-node-modules
      - prepare-playwright-cache
      - build-choysum-cli
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-impact.outputs.impacted_smoke_e2e_modules_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download and extract embedded assets
        uses: ./.github/actions/download-extract-embedded-assets
        with:
          artifact-name: pr-embedded-assets
          archive-path: .choysum/tmp/pr-embedded-assets.tar.gz

      - name: Download root node_modules
        uses: actions/download-artifact@v8
        with:
          name: pr-root-node-modules
          path: .choysum/tmp

      - name: Extract root node_modules
        run: tar -xzf .choysum/tmp/pr-root-node-modules.tar.gz -C .

      - name: Add local node_modules bin to PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Download choysum CLI
        uses: actions/download-artifact@v8
        with:
          name: pr-choysum-cli
          path: .choysum/tmp

      - name: Make choysum CLI executable
        run: chmod +x .choysum/tmp/choysum

      - name: Setup CLI testing pkg cache
        uses: ./.github/actions/setup-cli-testing-cache

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run smoke E2E suite
        run: |
          CHOYSUM_BIN="$(pwd)/.choysum/tmp/choysum"
          "$CHOYSUM_BIN" test e2e ${{ matrix.module }} -- smoke.spec.ts

  e2e-shard-targeted:
    name: pr / e2e-shard-targeted (${{ matrix.module }})
    if: ${{ needs.discover-impact.outputs.impacted_direct_e2e_no_smoke_modules_json != '[]' }}
    needs:
      - prepare-embedded-assets
      - discover-impact
      - prepare-root-node-modules
      - prepare-playwright-cache
      - build-choysum-cli
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-impact.outputs.impacted_direct_e2e_no_smoke_modules_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download and extract embedded assets
        uses: ./.github/actions/download-extract-embedded-assets
        with:
          artifact-name: pr-embedded-assets
          archive-path: .choysum/tmp/pr-embedded-assets.tar.gz

      - name: Download root node_modules
        uses: actions/download-artifact@v8
        with:
          name: pr-root-node-modules
          path: .choysum/tmp

      - name: Extract root node_modules
        run: tar -xzf .choysum/tmp/pr-root-node-modules.tar.gz -C .

      - name: Add local node_modules bin to PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Download choysum CLI
        uses: actions/download-artifact@v8
        with:
          name: pr-choysum-cli
          path: .choysum/tmp

      - name: Make choysum CLI executable
        run: chmod +x .choysum/tmp/choysum

      - name: Setup CLI testing pkg cache
        uses: ./.github/actions/setup-cli-testing-cache

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run targeted E2E suite
        run: |
          CHOYSUM_BIN="$(pwd)/.choysum/tmp/choysum"
          "$CHOYSUM_BIN" test e2e ${{ matrix.module }}

  e2e-all:
    name: pr / e2e-all
    needs:
      - discover-impact
      - smoke-e2e-shard
      - e2e-shard-targeted
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip smoke E2E aggregate when routing produces no smoke modules
        if: ${{ needs.discover-impact.outputs.run_pr_smoke_e2e != 'true' || needs.discover-impact.outputs.impacted_smoke_e2e_modules_json == '[]' }}
        run: echo "smoke E2E skipped by routing"

      - name: Verify smoke E2E matrix result
        if: ${{ needs.discover-impact.outputs.run_pr_smoke_e2e == 'true' && needs.discover-impact.outputs.impacted_smoke_e2e_modules_json != '[]' }}
        run: |
          echo "smoke-e2e-shard result=${{ needs.smoke-e2e-shard.result }}"
          if [ "${{ needs.smoke-e2e-shard.result }}" != "success" ]; then
            exit 1
          fi

      - name: Skip targeted E2E aggregate when routing produces no direct E2E modules without smoke specs
        if: ${{ needs.discover-impact.outputs.impacted_direct_e2e_no_smoke_modules_json == '[]' }}
        run: echo "targeted E2E skipped by routing"

      - name: Verify targeted E2E matrix result
        if: ${{ needs.discover-impact.outputs.impacted_direct_e2e_no_smoke_modules_json != '[]' }}
        run: |
          echo "e2e-shard-targeted result=${{ needs.e2e-shard-targeted.result }}"
          if [ "${{ needs.e2e-shard-targeted.result }}" != "success" ]; then
            exit 1
          fi

  bootstrap-verify:
    name: pr / bootstrap-verify
    needs:
      - discover-impact
    uses: ./.github/workflows/bootstrap-verify.yml
    with:
      run_ref: ${{ inputs.ref || github.ref }}
      run_bootstrap_verify: ${{ needs.discover-impact.outputs.run_bootstrap_verify }}
